<style>
  body { font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif; background:#fafaf9; color:#292524; }
  .fade-in { animation: fadeIn .25s ease-out; }
  @keyframes fadeIn { from { opacity:.3; transform: translateY(4px);} to {opacity:1; transform:none;} }
  @media (prefers-reduced-motion: reduce) { .fade-in { animation:none; } }
  .btn-correct { background:#dcfce7 !important; border-color:#22c55e !important; color:#166534 !important; }
  .btn-wrong { background:#fee2e2 !important; border-color:#ef4444 !important; color:#991b1b !important; }
  .katex { font-size: 1.08em; }
  .fig svg { max-width:100%; height:auto; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid #f59e0b; outline-offset: 2px; }
  .lv { display:inline-flex; align-items:center; justify-content:center; min-width:2.6em; padding:1px 8px; border-radius:999px; font-weight:900; font-size:.8rem; letter-spacing:.02em; white-space:nowrap; }
  .lv-A { background:#d1fae5; color:#065f46; } .lv-B { background:#fef3c7; color:#92400e; } .lv-C { background:#ffe4e6; color:#9f1239; } .lv-none { background:#f5f5f4; color:#a8a29e; }
  .fm-item { break-inside: avoid; }

  /* ===== 學習單預覽與列印 ===== */
  #print-overlay { position: fixed; inset: 0; z-index: 80; background: #57534e; overflow-y: auto; }
  .sheet { background: #fff; color:#111; width: 210mm; max-width: calc(100% - 24px); margin: 16px auto; padding: 14mm 14mm 12mm; box-shadow: 0 6px 24px rgba(0,0,0,.35); font-size: 11.5pt; line-height: 1.55; }
  .sheet-head { display:flex; justify-content:space-between; align-items:flex-end; gap:12px; border-bottom: 2px solid #111; padding-bottom: 6px; margin-bottom: 10px; flex-wrap: wrap; }
  .sheet-title { font-size: 16pt; font-weight: 800; letter-spacing: .02em; }
  .sheet-sub { font-size: 9.5pt; color:#444; }
  .sheet-fields { font-size: 10.5pt; display:flex; gap: 14px; white-space: nowrap; }
  .sheet-fields span { border-bottom: 1px solid #111; display:inline-block; min-width: 18mm; }
  .ver-tag { display:inline-block; border:1.5px solid #111; border-radius: 4px; padding: 0 6px; font-size: 9pt; font-weight: 700; margin-left: 6px; vertical-align: middle; }
  .sheet-guide { font-size: 9.5pt; color:#333; background:#f5f5f4; border-radius: 6px; padding: 5px 9px; margin-bottom: 8px; }
  .pq { break-inside: avoid; page-break-inside: avoid; padding: 8px 0 10px; border-bottom: 1px dashed #bbb; display: flow-root; }
  .pq-head { display:flex; gap: 6px; align-items:flex-start; }
  .pq-no { font-weight: 800; min-width: 1.8em; }
  .pq-adv { font-size: 8.5pt; border: 1px solid #111; border-radius: 3px; padding: 0 4px; margin-left: 4px; white-space: nowrap; }
  .pq-g { display: grid; grid-template-columns: minmax(0, 1fr) 46mm; gap: 10px; align-items: start; }
  .pq-fig { padding-top: 4px; }
  .pq-fig svg { width: 100%; height: auto; max-height: 46mm; }
  .pq-opts { display:flex; flex-wrap: wrap; gap: 4px 22px; margin: 4px 0 2px 2em; font-size: 10.5pt; }
  .pq-hint { margin: 5px 0 0 2em; border: 1.5px dashed #777; border-radius: 6px; padding: 3px 8px; font-size: 10.5pt; background: #fafafa; }
  .pq-hint b { margin-right: 4px; }
  .pq-work { margin: 6px 0 0 2em; position: relative; }
  .pq-work .ans { position:absolute; right: 0; bottom: 0; font-size: 10.5pt; }
  .pq-work .ans span { display:inline-block; border-bottom: 1px solid #111; min-width: 34mm; }
  .key-table { width:100%; border-collapse: collapse; font-size: 10pt; }
  .key-table td, .key-table th { border: 1px solid #999; padding: 3px 6px; vertical-align: top; text-align:left; }
  .key-table tr { break-inside: avoid; }
  @page { size: A4; margin: 12mm 12mm 12mm 12mm; }
  @media print {
    body > *:not(#print-overlay) { display: none !important; }
    html, body { background: #fff !important; }
    #print-overlay { position: static !important; background: none !important; overflow: visible !important; }
    .no-print { display: none !important; }
    .sheet { box-shadow: none; margin: 0; padding: 0; width: auto; max-width: none; }
    .sheet + .sheet { break-before: page; page-break-before: always; }
    .pq-hint { background: none; }
  }
</style>

<script>
// ===== 題庫：九年級會考複習（第一～六冊）=====
// 出題依據：老師提供的「幫你達 B 講義（第一～六冊）」「115 會考幫你達 B 300 題」「102-113 歷屆會考幫你達 B」「會考幫你達 B 終極版 12 個必考重點」與考前暖身操。
// 每單元題數依「111-115 會考前 10 題單元出現率」配置：出現越多的單元題目越多（10～18 題）。全部是基礎概念題，★進階 為會考原題或稍有變化的題型。
// 格式：q 題目、o 選項（第一個是正確答案，網站會自動打亂）、h 三層提示（第一步、第二步、最後一步）、s 觀念、fig 圖形（可省略）、lv: 2 為 ★進階
const R = String.raw;
const RAW_MODULES = [];
// ===== 第一冊 =====
RAW_MODULES.push(
{
  code: "01", book: 1, title: "簡單計算", chap: "第一冊 第 1、2 章", freq: 5,
  subtitle: "整數與分數的四則運算、先乘除後加減、正負號判斷",
  tips: {
    "四則運算順序": "先括號 → 再乘除 → 最後加減；絕對值也要先算出來（練功房 1）。",
    "正負號判斷": "連乘除時先數負號：偶數個負號為正、奇數個為負（練功房 1 第 1 題）。",
    "分數的加減": "負號放分子、通分、分子相加減，分母不相加（練功房 2）。",
    "分數的乘除": "帶分數先化假分數；除以一個數＝乘以它的倒數（練功房 2）。",
    "分數比大小": "全部化成小數或通分後再比；負數比大小要反過來（練功房 2 第 1 題）。",
    "分配律簡算": "看到相近的數字，用分配律湊整再算（練功房 1 第 4 題）。"
  },
  practice: [
    { q: R`算式 $(-2)\times|-5|-|-3|$ 之值為何？`, s: "四則運算順序",
      o: [R`$-13$`, R`$7$`, R`$13$`, R`$-7$`],
      h: [R`先把絕對值算出來：$|-5|=5$、$|-3|=3$。`, R`$(-2)\times5-3=-10-3$。`, R`答案是 $-13$。（106 會考第 1 題）`] },
    { q: R`計算 $12\div(-3)-2\times(-3)$ 之值為何？`, s: "四則運算順序",
      o: [R`$2$`, R`$-10$`, R`$18$`, R`$-18$`],
      h: [R`先乘除後加減，兩段分開算。`, R`$12\div(-3)=-4$；$2\times(-3)=-6$，所以 $-4-(-6)=-4+6$。`, R`答案是 $2$。（102 基測第 1 題）`] },
    { q: R`算式 $|3-2\times2|-(2-5)$ 之值為何？`, s: "四則運算順序",
      o: [R`$4$`, R`$5$`, R`$-5$`, R`$-6$`],
      h: [R`絕對值裡面也要先乘除後加減：$3-2\times2=3-4$。`, R`$|-1|-(-3)=1+3$。`, R`答案是 $4$。`] },
    { q: R`計算 $(-12)+(-18)\div(-6)-(-3)\times2$ 之值為何？`, s: "四則運算順序",
      o: [R`$-3$`, R`$-15$`, R`$11$`, R`$16$`],
      h: [R`先算除法和乘法：$(-18)\div(-6)$、$(-3)\times2$。`, R`$(-18)\div(-6)=3$，$(-3)\times2=-6$，所以 $-12+3-(-6)=-12+3+6$。`, R`答案是 $-3$。（95 基測第 1 題）`] },
    { q: R`計算 $9+(-2)\times[18-(-3)\times2]\div4$ 之值為何？`, s: "四則運算順序",
      o: [R`$-3$`, R`$3$`, R`$21$`, R`$42$`],
      h: [R`先算中括號裡面：$18-(-3)\times2$，裡面也是先乘後減。`, R`$18-(-6)=24$，再算 $(-2)\times24\div4=-12$。`, R`$9+(-12)=-3$。（91 基測第 1 題）`] },
    { q: R`計算 $(-1)\times(-2)\times(-3)\times(-4)\times(-5)$ 之值為何？`, s: "正負號判斷",
      o: [R`$-120$`, R`$120$`, R`$-15$`, R`$15$`],
      h: [R`先數負號個數：共 $5$ 個負號。`, R`奇數個負號 → 答案是負的；數字部分 $1\times2\times3\times4\times5=120$。`, R`答案是 $-120$。`] },
    { q: R`已知 $10\times11\times12\times13\times14=240240$，則 $(-11)\times(-12)\times(-13)\times(-14)\times(-15)=$？`, s: "正負號判斷", lv: 2,
      o: [R`$-360360$`, R`$360360$`, R`$-320320$`, R`$320320$`],
      h: [R`5 個負號 → 結果是負的。數字部分可以用 $240240$ 改寫：$11\times12\times13\times14=240240\div10$。`, R`$11\times12\times13\times14=24024$，再乘 $15$：$24024\times15$。`, R`$24024\times15=360360$，加上負號得 $-360360$。（96 基測）`] },
    { q: R`算式 $-\frac{5}{3}-\left(-\frac{1}{6}\right)$ 之值為何？`, s: "分數的加減",
      o: [R`$-\frac{3}{2}$`, R`$-\frac{11}{6}$`, R`$-\frac{4}{3}$`, R`$-\frac{2}{3}$`],
      h: [R`減去一個負數＝加上它的相反數：$-\frac{5}{3}+\frac{1}{6}$。`, R`通分：$-\frac{10}{6}+\frac{1}{6}=-\frac{9}{6}$。`, R`約分得 $-\frac{3}{2}$。（108 會考第 1 題）`] },
    { q: R`計算 $\frac{5}{6}-\frac{3}{8}+\left(-2\frac{7}{8}\right)$ 之值為何？`, s: "分數的加減",
      o: [R`$-2\frac{5}{12}$`, R`$-\frac{2}{3}$`, R`$-2\frac{1}{12}$`, R`$-3\frac{5}{12}$`],
      h: [R`帶分數化成假分數：$-2\frac{7}{8}=-\frac{23}{8}$。分母 $8$ 的兩項可以先合併。`, R`$-\frac{3}{8}-\frac{23}{8}=-\frac{26}{8}=-\frac{13}{4}$，再算 $\frac{5}{6}-\frac{13}{4}=\frac{10}{12}-\frac{39}{12}$。`, R`$=-\frac{29}{12}=-2\frac{5}{12}$。`] },
    { q: R`計算 $\left(-1\frac{1}{2}\right)\times\left(-3\frac{1}{4}\right)\times\frac{2}{3}$ 之值為何？`, s: "分數的乘除",
      o: [R`$\frac{13}{4}$`, R`$-\frac{13}{4}$`, R`$\frac{11}{4}$`, R`$\frac{13}{8}$`],
      h: [R`兩個負號 → 結果為正。帶分數化假分數：$-\frac{3}{2}$、$-\frac{13}{4}$。`, R`$\frac{3}{2}\times\frac{13}{4}\times\frac{2}{3}$，$\frac{3}{2}$ 和 $\frac{2}{3}$ 可以先約掉。`, R`答案是 $\frac{13}{4}$（$=3\frac{1}{4}$）。（104 會考第 1 題）`] },
    { q: R`計算 $4\frac{3}{8}\div2\frac{1}{4}\div2$ 之值為何？`, s: "分數的乘除",
      o: [R`$\frac{35}{36}$`, R`$\frac{35}{9}$`, R`$\frac{7}{4}$`, R`$\frac{5}{2}$`],

async function initFirebase() {
  if (!MY_FIREBASE_CONFIG.apiKey || MY_FIREBASE_CONFIG.apiKey === "請貼上") { cloudStatus = "not_configured"; renderNav(); return; }
  try {
    const fbApp = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js");
    const fbAuth = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js");
    const fsMod = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js");
    const app = fbApp.initializeApp(MY_FIREBASE_CONFIG);
    auth = fbAuth.getAuth(app);
    await fbAuth.signInAnonymously(auth);
    fs = fsMod; db = fs.getFirestore(app);   // 登入完成才啟用資料庫，避免未登入時讀取失敗
    cloudStatus = "connected";
    if (studentName) syncDataToCloud();
  } catch (e) { console.error("Firebase 連線失敗：", e); cloudStatus = "error"; db = null; if (studentName) showToast("⚠️ 連不上雲端（可能是網路被擋），這次的成績先存在這台裝置。", "warn", 10000); }
  renderNav();
}
function studentDocRef(id) { return fs.doc(db, "artifacts", appId, "public", "data", COLLECTION_NAME, id); }
function mergeCloudIntoLocal(c) {
  if (c.scores) for (const k in c.scores) {
    const l = scores[k], r = c.scores[k];
    if (!l) scores[k] = r;
    else if ((l.v === 2) !== (r.v === 2)) { const nw = l.v === 2 ? l : r; scores[k] = { ...nw, n: Math.max(l.n || 1, r.n || 1) }; }
    else scores[k] = { ...l, first: l.first ?? r.first, best: Math.max(l.best || 0, r.best || 0), n: Math.max(l.n || 0, r.n || 0) };
  }
  if (c.slain) for (const q in c.slain) slain[q] = Math.max(slain[q] || 0, c.slain[q]);
  if (Array.isArray(c.mistakes)) c.mistakes.forEach(raw => {
    if (!findQuestionData(raw.modIdx, raw.q)) return;
    const r = normMistake(raw), i = mistakes.findIndex(x => x.q === r.q);
    if (i === -1) mistakes.push(r); else if (r.upd > mistakes[i].upd) mistakes[i] = r;
  });
  // 已消滅（而且之後沒有再錯）的題目，不要被舊資料加回來
  mistakes = mistakes.filter(m => !(slain[m.q] && slain[m.q] >= m.upd));
  if (c.mistakeLog) for (const k in c.mistakeLog) { if (!mistakeLog[k] || (c.mistakeLog[k].count || 0) > (mistakeLog[k].count || 0)) mistakeLog[k] = c.mistakeLog[k]; }
  if (Array.isArray(c.history)) { const seen = new Set(studentHistory.map(h => h.timestamp)); c.history.forEach(h => { if (!seen.has(h.timestamp)) studentHistory.push(h); }); studentHistory.sort((a, b) => a.timestamp - b.timestamp); }
  saveLocalAll();
}
let syncChain = Promise.resolve();

async function doSyncDataToCloud() {
  if (!db || !studentName) return;
  const idAtStart = getStudentId();
  try {
    const ref = studentDocRef(idAtStart);
    const snap = await fs.getDoc(ref);
    if (idAtStart !== getStudentId()) return;
    const sig = () => JSON.stringify([scores, mistakes, studentHistory.length, Object.keys(slain).length]);
    const before = sig(), histBefore = studentHistory.length;
    if (snap.exists()) mergeCloudIntoLocal(snap.data());
    // 第一次同步：把雲端上「同一位學生、代號寫法不同」的舊紀錄一起找回來（例如 07_王小明、7_王 小明）
    if (!legacyChecked[idAtStart]) {
      legacyChecked[idAtStart] = true;
      let found = snap.exists();
      try {
        const all = await fs.getDocs(fs.collection(db, "artifacts", appId, "public", "data", COLLECTION_NAME));
        const olds = []; all.forEach(d => { const r = d.data(); if (r && r.studentId !== idAtStart && !r.mergedInto && canonKey(r.studentSeat, r.studentName) === idAtStart) olds.push(r); });
        for (const r of olds) { mergeCloudIntoLocal(r); found = true; await fs.setDoc(studentDocRef(r.studentId), { ...r, mergedInto: idAtStart }); }
      } catch (e) { console.warn("舊紀錄搜尋失敗：", e); }

      if (found || studentHistory.length) showToast(`☁️ 歡迎回來，${who}！已載入你的紀錄：完成 ${studentHistory.length} 回。`, "ok", 5000);

    }

}

function saveScore(i, s) {

  else if (cur.v !== 2) scores[i] = { first: cur.first, best: s, n: (cur.n || 1) + 1, v: 2, oldBest: cur.best };   // 改版前的最佳（含看完提示）不再沿用

const STAGE_INFO = {
  1: { name: "第一關：馬上重做", short: "第一關", icon: "👾", wait: 0, color: "rose" },
  2: { name: "第二關：兩天後再戰", short: "第二關", icon: "👹", wait: 2 * 864e5, color: "amber" },

function promoteMistake(qText) {

  const t = nowTs();

}

function computeWeakSkills() {
  const tally = {};
  mistakes.forEach(m => {
    const info = SKILL_OF[m.q]; if (!info) return;
    const k = info.skill; tally[k] = tally[k] || { skill: k, modIdx: info.modIdx, now: 0, total: 0 };
    tally[k].now++;
  });
  Object.entries(mistakeLog).forEach(([q, v]) => {
    const info = SKILL_OF[q]; if (!info || !tally[info.skill]) return;
    tally[info.skill].total += v.count || 1;
  });
  return Object.values(tally).sort((a, b) => b.now - a.now || b.total - a.total);
}

function progressChartSVG(items) {
  const W = 620, H = 330, L = 46, Rr = 12, T = 18, B = 286;
  const pw = W - L - Rr, gw = pw / items.length, bw = Math.min(30, gw * 0.3);
  const y = v => B - (B - T) * v / 100;
  let g = `<rect x="${L}" y="${y(80)}" width="${pw}" height="${y(65) - y(80)}" fill="#fef3c7" opacity=".7"/><text x="${W - Rr - 4}" y="${y(65) - 5}" font-size="12" font-weight="700" fill="#b45309" text-anchor="end">B 目標線 65%</text>`;
  for (let v = 0; v <= 100; v += 20) g += `<line x1="${L}" x2="${W - Rr}" y1="${y(v)}" y2="${y(v)}" stroke="#e7e5e4" stroke-width="1"/><text x="${L - 8}" y="${y(v) + 4}" font-size="14" fill="#78716c" text-anchor="end">${v}</text>`;
  g += `<line x1="${L}" x2="${W - Rr}" y1="${y(65)}" y2="${y(65)}" stroke="#f59e0b" stroke-width="1.6" stroke-dasharray="6 4"/>`;
  items.forEach((it, i) => {
    const cx = L + gw * i + gw / 2;
    const bar = (x, v, c) => `<rect x="${x}" y="${y(v)}" width="${bw}" height="${B - y(v)}" rx="5" fill="${c}"/>${it.has ? `<text x="${x + bw / 2}" y="${y(v) - 6}" font-size="12" font-weight="700" fill="#57534e" text-anchor="middle">${v}</text>` : ""}`;
    g += bar(cx - bw - 2, it.first, "#d6d3d1") + bar(cx + 2, it.best, "#10b981");
    g += `<text x="${cx}" y="${B + 22}" font-size="${items.length > 6 ? 13 : 15}" font-weight="700" fill="#57534e" text-anchor="middle">${it.label}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" class="w-full h-auto" role="img" aria-label="首次與最佳答對率">${g}
    <line x1="${L}" x2="${W - Rr}" y1="${B}" y2="${B}" stroke="#a8a29e" stroke-width="1.2"/></svg>
    <div class="flex flex-wrap justify-center gap-6 text-sm font-bold text-stone-600 mt-1">

      <span class="flex items-center gap-2"><span class="w-10 h-3 rounded bg-emerald-500"></span>最佳表現</span></div>`;
}

function buildMockSet() {
  const pool = MODS.map(m => m.practice.slice());
  const chosen = [];
  for (let n = 0; n < MOCK_N; n++) {
    const cand = MODS.map((m, i) => i).filter(i => pool[i].length);
    const tw = cand.reduce((a, i) => a + unitWeight(MODS[i]), 0);
    let r = Math.random() * tw, pick = cand[0];
    for (const i of cand) { r -= unitWeight(MODS[i]); if (r <= 0) { pick = i; break; } }
    const k = Math.floor(Math.random() * pool[pick].length);
    chosen.push(pool[pick].splice(k, 1)[0]);
  }
  return chosen.sort((a, b) => (a.lv - b.lv) || (MODS[a.modIdx].book - MODS[b.modIdx].book));
}

function figSVG(f, forPrint) {

  if (f.t === "geo") return geoSVG(f, forPrint);
  const ink = forPrint ? "#111" : "#44403c", fill = forPrint ? "none" : "#fef3c7", lab = forPrint ? "#111" : "#b45309", soft = forPrint ? "#999" : "#d6d3d1";
  const T = (x, y, s, anchor = "middle") => `<text x="${x}" y="${y}" font-size="15" font-weight="700" fill="${lab}" text-anchor="${anchor}" font-family="Times New Roman, serif" font-style="italic">${s}</text>`;
  const N = (x, y, s, anchor = "middle", sz = 12, c = ink) => `<text x="${x}" y="${y}" font-size="${sz}" fill="${c}" text-anchor="${anchor}" font-family="Noto Sans TC, sans-serif">${s}</text>`;
  if (f.t === "rt") {
    const k = 120 / Math.max(f.na, f.nb), w = f.nb * k, h = f.na * k, x0 = 30, y0 = 20;
    const B = [x0, y0 + h], C = [x0 + w, y0 + h], A = [x0 + w, y0];

// 每題結果分成：solo 沒看提示答對／hinted 看 1～2 步答對（以上兩種＝獨立答對，計分）

function selectHintOption(qIdx, oIdx) {
  const st = qState[qIdx]; if (st.answered) return;

  } else {

function checkModuleCompletion(modIdx) {

async function fetchAllStudentRecords() {

  const snap = await fs.getDocs(fs.collection(db, "artifacts", appId, "public", "data", COLLECTION_NAME));
  const groups = {};
  snap.forEach(d => { const r = d.data(); if (!r || r.mergedInto) return; const k = canonKey(r.studentSeat, r.studentName); (groups[k] = groups[k] || []).push(r); });
  // 同一位學生如果有不同寫法的紀錄（學生尚未重新登入），先在後台合併顯示
  const out = Object.values(groups).map(rs => rs.length === 1 ? { ...rs[0], studentSeat: normSeat(rs[0].studentSeat), studentName: normName(rs[0].studentName) } : mergeRecords(rs));

function mergeRecords(rs) {
  const out = { studentId: rs[0].studentId, studentSeat: normSeat(rs[0].studentSeat), studentName: normName(rs[0].studentName), scores: {}, mistakes: [], slain: {}, mistakeLog: {}, history: [], lastUpdated: 0 };
  rs.forEach(r => {
    Object.entries(r.scores || {}).forEach(([k, v]) => { const l = out.scores[k]; out.scores[k] = l ? { first: Math.min(l.first, v.first), best: Math.max(l.best, v.best), n: (l.n || 1) + (v.n || 1) } : v; });
    Object.assign(out.slain, r.slain || {});
    (r.mistakes || []).forEach(m => { if (!out.mistakes.some(x => x.q === m.q)) out.mistakes.push(m); });
    Object.entries(r.mistakeLog || {}).forEach(([q, v]) => { if (!out.mistakeLog[q] || (v.count || 0) > out.mistakeLog[q].count) out.mistakeLog[q] = v; });
    out.history.push(...(r.history || [])); out.lastUpdated = Math.max(out.lastUpdated, r.lastUpdated || 0);
  });
  out.history.sort((a, b) => a.timestamp - b.timestamp); out.mistakesCount = out.mistakes.length;

// groups: [{ title, subtitle, items: [{ q, unit, wrongN?, unitTag? }] }]
function renderSheets(groups, ver, withOpts, withKey, summary) {
  const vi = VERSION_INFO[ver];
  const nh = ver === "A" ? 0 : ver === "B" ? 1 : 2;
  const stepNames = ["第一步", "第二步"];
  const letters = ["(A)", "(B)", "(C)", "(D)"];
  const hasWrong = groups.some(g => g.items.some(it => it.wrongN !== undefined));
  let html = "", keyRows = [];
  groups.forEach(g => {
    const body = g.items.map((it, n) => {
      const q = it.q;
      const ordered = withOpts ? seededShuffle(q.options, q.q) : null; // 選項順序以題目為種子，每次列印都一樣
      keyRows.push({ unit: it.unit, n: n + 1, ans: ordered ? `${letters[ordered.indexOf(q.correctStr)]} ${q.correctStr}` : q.correctStr, how: q.hints[2], wrongN: it.wrongN });
      return `<div class="pq ${q.fig ? "pq-g" : ""}"><div class="pq-main">
        <div class="pq-head"><span class="pq-no">${n + 1}.</span><div>${it.unitTag ? `<span class="pq-adv" style="margin:0 6px 0 0">${it.unitTag}</span>` : ""}${q.q}${q.lv === 2 ? `<span class="pq-adv">★進階</span>` : ""}</div></div>
        ${ordered ? `<div class="pq-opts">${ordered.map((o, k) => `<span>${letters[k]} ${o}</span>`).join("")}</div>` : ""}
        ${q.hints.slice(0, nh).map((h, k) => `<div class="pq-hint"><b>${stepNames[k]}</b>${h}</div>`).join("")}
        <div class="pq-work" style="height:${q.fig && vi.work < 30 ? 30 : vi.work}mm">${ver === "C" ? `<span style="font-size:10pt;color:#555">最後一步：</span>` : ""}<div class="ans">答：<span>&nbsp;</span></div></div>
      </div>${q.fig ? `<div class="pq-fig">${figSVG(q.fig, true)}</div>` : ""}</div>`;
    }).join("");
    html += `<section class="sheet">
      <div class="sheet-head">
        <div><div class="sheet-title">${g.title}<span class="ver-tag">${vi.name}</span></div>
        <div class="sheet-sub">${g.subtitle}</div></div>
        <div class="sheet-fields">班級 <span></span> 座號 <span style="min-width:10mm"></span> 姓名 <span style="min-width:26mm"></span></div>
      </div>
      <div class="sheet-guide">📝 ${vi.guide}${withOpts ? "（請把選項代號寫在「答：」後面）" : ""}</div>
      ${body}
    </section>`;
  });
  if (withKey) {
    html += `<section class="sheet"><div class="sheet-head"><div><div class="sheet-title">解答（教師用）<span class="ver-tag">${vi.name}</span></div><div class="sheet-sub">關鍵步驟即網站上的第 3 個提示${hasWrong ? "；「答錯人數」為曾答錯（或用完提示）的學生數" : ""}</div></div></div>
      <table class="key-table"><thead><tr><th style="width:16%">單元</th><th style="width:6%">題</th>${hasWrong ? `<th style="width:9%">答錯人數</th>` : ""}<th style="width:28%">答案</th><th>關鍵步驟</th></tr></thead><tbody>
      ${keyRows.map(r => `<tr><td>${r.unit}</td><td>${r.n}</td>${hasWrong ? `<td>${r.wrongN ?? ""} 人</td>` : ""}<td>${r.ans}</td><td>${r.how}</td></tr>`).join("")}</tbody></table></section>`;
  }
  const root = document.getElementById("print-root");
  root.innerHTML = html;
  document.getElementById("print-summary").textContent = `學習單預覽｜${vi.name}｜${summary}`;
  document.getElementById("print-overlay").classList.remove("hidden");
  document.getElementById("print-overlay").scrollTop = 0;
  document.body.style.overflow = "hidden";
  triggerKatex(root);
}

function seededShuffle(arr, seedStr) {
  let h = 2166136261; for (const c of seedStr) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); }
  const rnd = () => { h = Math.imul(h ^ (h >>> 15), 2246822507); h = Math.imul(h ^ (h >>> 13), 3266489909); h ^= h >>> 16; return (h >>> 0) / 4294967296; };
  const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a;
}

      <div class="text-sm font-bold text-emerald-700 bg-white rounded-2xl px-4 py-2">🏆 已消滅 ${killed} 隻</div></div>
    <p class="text-sm text-rose-900/80 mb-4">錯題要在當下、2 天後、5 天後都獨立答對，才算真正記住。${nextLock ? `下一隻怪物 ${fmtTime(nextLock.due)} 解鎖（${fmtLeft(nextLock.due - t)}）。` : ""}</p>
    <div class="grid grid-cols-3 gap-3 max-w-xl">${cell(1)}${cell(2)}${cell(3)}</div>
    <button onclick="switchView('review')" class="mt-5 px-5 py-3 rounded-2xl bg-rose-500 hover:bg-rose-600 text-white font-bold">前往錯題重練區 →</button>
  </section>`;
}

// ---------- 啟動 ----------
window.addEventListener("beforeunload", e => { if (isQuizActive) { e.preventDefault(); e.returnValue = ""; } });
(function boot() {
  const cur = lsGet(LS_PREFIX + "current_student", null);
  if (cur && cur.seat && cur.name) { studentSeat = normSeat(cur.seat) || cur.seat; studentName = normName(cur.name) || cur.name; migrateLocal(cur.seat, cur.name); loadLocal(); renderOverview(); renderNav(); }
  else renderNameEntry();
  initFirebase();
})();

</script>
