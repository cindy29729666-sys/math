<style>
  body { font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif; background:#fafaf9; color:#292524; }
  .fade-in { animation: fadeIn .25s ease-out; }
  @keyframes fadeIn { from { opacity:.3; transform: translateY(4px);} to {opacity:1; transform:none;} }
  @media (prefers-reduced-motion: reduce) { .fade-in { animation:none; } }
  .btn-correct { background:#dcfce7 !important; border-color:#22c55e !important; color:#166534 !important; }
  .btn-wrong { background:#fee2e2 !important; border-color:#ef4444 !important; color:#991b1b !important; }
  .katex { font-size: 1.08em; }
  .fig svg { max-width:100%; height:auto; }
  button:focus-visible, input:focus-visible { outline: 3px solid #f59e0b; outline-offset: 2px; }

  /* ===== 學習單預覽與列印 ===== */
  #print-overlay { position: fixed; inset: 0; z-index: 80; background: #57534e; overflow-y: auto; }
  .sheet { background: #fff; color:#111; width: 210mm; max-width: calc(100% - 24px); margin: 16px auto; padding: 14mm 14mm 12mm; box-shadow: 0 6px 24px rgba(0,0,0,.35); font-size: 11.5pt; line-height: 1.55; }
  .sheet-head { display:flex; justify-content:space-between; align-items:flex-end; gap:12px; border-bottom: 2px solid #111; padding-bottom: 6px; margin-bottom: 10px; flex-wrap: wrap; }
  .sheet-title { font-size: 16pt; font-weight: 800; letter-spacing: .02em; }
  .sheet-sub { font-size: 9.5pt; color:#444; }
  .sheet-fields { font-size: 10.5pt; display:flex; gap: 14px; white-space: nowrap; }
  .sheet-fields span { border-bottom: 1px solid #111; display:inline-block; min-width: 18mm; }
  .ver-tag { display:inline-block; border:1.5px solid #111; border-radius: 4px; padding: 0 6px; font-size: 9pt; font-weight: 700; margin-left: 6px; vertical-align: middle; }
  .sheet-guide { font-size: 9.5pt; color:#333; background:#f5f5f4; border-radius: 6px; padding: 5px 9px; margin-bottom: 8px; }
  .pq { break-inside: avoid; page-break-inside: avoid; padding: 8px 0 10px; border-bottom: 1px dashed #bbb; display: flow-root; }
  .pq-head { display:flex; gap: 6px; align-items:flex-start; }
  .pq-no { font-weight: 800; min-width: 1.8em; }
  .pq-adv { font-size: 8.5pt; border: 1px solid #111; border-radius: 3px; padding: 0 4px; margin-left: 4px; white-space: nowrap; }
  .pq-g { display: grid; grid-template-columns: minmax(0, 1fr) 40mm; gap: 10px; align-items: start; }
  .pq-fig { padding-top: 4px; }
  .pq-fig svg { width: 100%; height: auto; max-height: 44mm; }
  .pq-opts { display:flex; flex-wrap: wrap; gap: 4px 22px; margin: 4px 0 2px 2em; font-size: 10.5pt; }
  .pq-hint { margin: 5px 0 0 2em; border: 1.5px dashed #777; border-radius: 6px; padding: 3px 8px; font-size: 10.5pt; background: #fafafa; }
  .pq-hint b { margin-right: 4px; }
  .pq-work { margin: 6px 0 0 2em; position: relative; }
  .pq-work .ans { position:absolute; right: 0; bottom: 0; font-size: 10.5pt; }
  .pq-work .ans span { display:inline-block; border-bottom: 1px solid #111; min-width: 34mm; }
  .key-table { width:100%; border-collapse: collapse; font-size: 10pt; }
  .key-table td, .key-table th { border: 1px solid #999; padding: 3px 6px; vertical-align: top; text-align:left; }
  .page-break { break-before: page; page-break-before: always; }
  @page { size: A4; margin: 12mm 12mm 12mm 12mm; }
  @media print {
    body > *:not(#print-overlay) { display: none !important; }
    #print-overlay { position: static !important; background: none !important; overflow: visible !important; }
    .no-print { display: none !important; }
    .sheet { box-shadow: none; margin: 0; padding: 0; width: auto; max-width: none; }
    .sheet + .sheet { break-before: page; page-break-before: always; }
    .pq-hint { background: none; }
  }
</style>

<script>
// ===== 題庫：八年級 2-2 ~ 3-2（對齊基礎講義：概念、例題、牛刀小試；部分題目取材段考模擬卷） =====
// 格式：q 題目、o 選項（第一個是正確答案，網站會自動打亂）、h 三層提示（h[0] 第一步、h[1] 第二步、h[2] 答案與說明）
// fig 圖形（可省略）、lv: 2 代表 ★進階（段考題型）
const R = String.raw;
const RAW_MODULES = [
{
  id: 1, title: "2-2 根式的運算", subtitle: "根式的乘除、最簡根式、有理化分母、根式加減與四則運算",
  practice: [
    { q: R`計算 $2\sqrt{10}\times\left(-\dfrac{1}{2}\right)$ 的結果為何？`,
      o: [R`$-\sqrt{10}$`, R`$\sqrt{10}$`, R`$-2\sqrt{5}$`, R`$-\dfrac{1}{4}\sqrt{10}$`],
      h: [R`根號外的數字和數字相乘，根號部分照抄。`, R`$2\times\left(-\dfrac12\right)=-1$，所以結果是 $-1\times\sqrt{10}$。`, R`$-1\times\sqrt{10}$ 簡記為 $-\sqrt{10}$。`] },
    { q: R`計算 $5\sqrt{2}\times 3\sqrt{7}$ 的結果為何？`,
      o: [R`$15\sqrt{14}$`, R`$8\sqrt{14}$`, R`$15\sqrt{9}$`, R`$35\sqrt{6}$`],
      h: [R`根號外乘根號外、根號內乘根號內：$\sqrt{a}\times\sqrt{b}=\sqrt{ab}$。`, R`外：$5\times3=15$；內：$\sqrt{2}\times\sqrt{7}=\sqrt{14}$。`, R`答案是 $15\sqrt{14}$。`] },
    { q: R`計算 $\sqrt{45}\div\sqrt{3}$ 的結果為何？`,
      o: [R`$\sqrt{15}$`, R`$15$`, R`$\sqrt{42}$`, R`$3\sqrt{3}$`],
      h: [R`$\sqrt{a}\div\sqrt{b}=\sqrt{\dfrac{a}{b}}$（$b>0$）。`, R`$\sqrt{45}\div\sqrt{3}=\sqrt{\dfrac{45}{3}}$，而 $45\div3=15$。`, R`答案是 $\sqrt{15}$。`] },
    { q: R`將 $\sqrt{75}$ 化為最簡根式。`,
      o: [R`$5\sqrt{3}$`, R`$3\sqrt{5}$`, R`$25\sqrt{3}$`, R`$15\sqrt{5}$`],
      h: [R`找出 $75$ 的因數中最大的完全平方數（$4,9,16,25,\dots$）。`, R`$75=25\times3=5^2\times3$。`, R`$\sqrt{75}=\sqrt{5^2\times3}=5\sqrt{3}$。`] },
    { q: R`下列何者是最簡根式？`,
      o: [R`$2\sqrt{3}$`, R`$\sqrt{12}$`, R`$\dfrac{1}{\sqrt{2}}$`, R`$\sqrt{\dfrac{2}{5}}$`],
      h: [R`最簡根式三條件：①根號內沒有大於 1 的完全平方因數 ②分母沒有根號 ③根號內不是分數或小數。`, R`$\sqrt{12}$ 裡有 $4$；$\dfrac{1}{\sqrt2}$ 分母有根號；$\sqrt{\dfrac25}$ 根號內是分數。`, R`只有 $2\sqrt{3}$ 符合，答案是 $2\sqrt{3}$。`] },
    { q: R`將 $\sqrt{8}\times\sqrt{14}$ 化為最簡根式。`,
      o: [R`$4\sqrt{7}$`, R`$2\sqrt{14}$`, R`$7\sqrt{4}$`, R`$16\sqrt{7}$`],
      h: [R`先相乘：$\sqrt{8}\times\sqrt{14}=\sqrt{8\times14}=\sqrt{112}$。`, R`$112=16\times7=4^2\times7$。`, R`$\sqrt{112}=4\sqrt{7}$。`] },
    { q: R`將 $\dfrac{5}{\sqrt{2}}$ 有理化分母。`,
      o: [R`$\dfrac{5\sqrt{2}}{2}$`, R`$5\sqrt{2}$`, R`$\dfrac{\sqrt{10}}{2}$`, R`$\dfrac{5}{2}$`],
      h: [R`分子、分母同乘 $\sqrt{2}$，讓分母的根號消失。`, R`$\dfrac{5\times\sqrt2}{\sqrt2\times\sqrt2}$，而 $\sqrt2\times\sqrt2=2$。`, R`答案是 $\dfrac{5\sqrt{2}}{2}$。`] },
    { q: R`將 $\sqrt{\dfrac{1}{7}}$ 化為最簡根式。`,
      o: [R`$\dfrac{\sqrt{7}}{7}$`, R`$\dfrac{1}{7}$`, R`$7\sqrt{7}$`, R`$\sqrt{7}$`],
      h: [R`$\sqrt{\dfrac17}=\dfrac{\sqrt1}{\sqrt7}=\dfrac{1}{\sqrt7}$。`, R`分子、分母同乘 $\sqrt7$：$\dfrac{1\times\sqrt7}{\sqrt7\times\sqrt7}$。`, R`答案是 $\dfrac{\sqrt{7}}{7}$。`] },
    { q: R`將 $\sqrt{0.3}$ 化為最簡根式。`,
      o: [R`$\dfrac{\sqrt{30}}{10}$`, R`$\dfrac{\sqrt{3}}{10}$`, R`$\dfrac{3}{10}$`, R`$\dfrac{\sqrt{3}}{\sqrt{10}}$`],
      h: [R`小數先化成分數：$0.3=\dfrac{3}{10}$。`, R`$\sqrt{\dfrac{3}{10}}=\dfrac{\sqrt3}{\sqrt{10}}$，分子、分母同乘 $\sqrt{10}$。`, R`$\dfrac{\sqrt3\times\sqrt{10}}{10}=\dfrac{\sqrt{30}}{10}$。`] },
    { q: R`計算 $\sqrt{12}+5\sqrt{3}$ 並化簡。`,
      o: [R`$7\sqrt{3}$`, R`$6\sqrt{3}$`, R`$5\sqrt{15}$`, R`$17\sqrt{3}$`],
      h: [R`先把 $\sqrt{12}$ 化成最簡根式，才看得出是不是同類方根。`, R`$\sqrt{12}=2\sqrt3$，所以算式變成 $2\sqrt3+5\sqrt3$。`, R`同類方根相加：$(2+5)\sqrt3=7\sqrt3$。`] },
    { q: R`計算 $\sqrt{18}+\sqrt{8}-\sqrt{27}+\sqrt{75}$ 並化簡。`,
      o: [R`$5\sqrt{2}+2\sqrt{3}$`, R`$5\sqrt{2}-2\sqrt{3}$`, R`$\sqrt{2}+8\sqrt{3}$`, R`$7\sqrt{5}$`],
      h: [R`每一項先化簡：$\sqrt{18}=3\sqrt2$、$\sqrt8=2\sqrt2$。`, R`$\sqrt{27}=3\sqrt3$、$\sqrt{75}=5\sqrt3$，算式為 $3\sqrt2+2\sqrt2-3\sqrt3+5\sqrt3$。`, R`$\sqrt2$ 合併得 $5\sqrt2$，$\sqrt3$ 合併得 $2\sqrt3$，答案 $5\sqrt2+2\sqrt3$。`] },
    { q: R`計算 $\sqrt{3}\times(3\sqrt{3}+4\sqrt{6})$ 並化簡。`,
      o: [R`$9+12\sqrt{2}$`, R`$9+4\sqrt{6}$`, R`$12\sqrt{2}$`, R`$21\sqrt{2}$`],
      h: [R`用分配律：$\sqrt3\times3\sqrt3+\sqrt3\times4\sqrt6$。`, R`$\sqrt3\times3\sqrt3=3\times3=9$；$\sqrt3\times4\sqrt6=4\sqrt{18}$。`, R`$4\sqrt{18}=4\times3\sqrt2=12\sqrt2$，答案 $9+12\sqrt2$。`] },
    { q: R`計算 $(\sqrt{5}+\sqrt{2})(\sqrt{5}-\sqrt{2})$。`,
      o: [R`$3$`, R`$7$`, R`$\sqrt{3}$`, R`$3+2\sqrt{10}$`],
      h: [R`用平方差公式：$(a+b)(a-b)=a^2-b^2$。`, R`$(\sqrt5)^2-(\sqrt2)^2=5-2$。`, R`答案是 $3$。`] },
    { q: R`計算 $\sqrt{\dfrac{3}{2}}-\sqrt{\dfrac{2}{3}}$ 並化簡。`, lv: 2,
      o: [R`$\dfrac{\sqrt{6}}{6}$`, R`$0$`, R`$\dfrac{5\sqrt{6}}{6}$`, R`$\dfrac{\sqrt{6}}{5}$`],
      h: [R`先各自有理化：$\sqrt{\dfrac32}=\dfrac{\sqrt3}{\sqrt2}=\dfrac{\sqrt6}{2}$。`, R`$\sqrt{\dfrac23}=\dfrac{\sqrt6}{3}$，算式為 $\dfrac{\sqrt6}{2}-\dfrac{\sqrt6}{3}$，通分母 $6$。`, R`$\dfrac{3\sqrt6}{6}-\dfrac{2\sqrt6}{6}=\dfrac{\sqrt6}{6}$。`] }
  ]
},
{
  id: 2, title: "2-3 畢氏定理", subtitle: "求直角三角形邊長、正方形與長方形對角線、正三角形的高、斜邊上的高、兩點距離",
  practice: [
    { q: R`如圖，直角三角形兩股為 $6$、$8$，求斜邊 $x$。`, fig: { t: "rt", a: "6", b: "8", c: "x", na: 6, nb: 8 },
      o: [R`$10$`, R`$14$`, R`$2\sqrt{7}$`, R`$48$`],
      h: [R`畢氏定理：斜邊$^2$＝股$^2$＋股$^2$（斜邊是直角對面的最長邊）。`, R`$x^2=6^2+8^2=36+64=100$。`, R`$x=\sqrt{100}=10$。`] },
    { q: R`如圖，直角三角形斜邊為 $17$，一股為 $15$，求另一股 $z$。`, fig: { t: "rt", a: "15", b: "z", c: "17", na: 15, nb: 8 },
      o: [R`$8$`, R`$2$`, R`$\sqrt{514}$`, R`$32$`],
      h: [R`求「股」要用減的：股$^2$＝斜邊$^2-$另一股$^2$。`, R`$z^2=17^2-15^2=289-225=64$。`, R`$z=\sqrt{64}=8$。`] },
    { q: R`如圖，直角三角形兩股為 $3$、$2$，求斜邊 $x$。`, fig: { t: "rt", a: "3", b: "2", c: "x", na: 3, nb: 2 },
      o: [R`$\sqrt{13}$`, R`$5$`, R`$\sqrt{5}$`, R`$13$`],
      h: [R`斜邊$^2$＝股$^2$＋股$^2$。`, R`$x^2=3^2+2^2=9+4=13$。`, R`$x=\sqrt{13}$。`] },
    { q: R`如圖，直角三角形斜邊為 $10$，一股為 $7$，求另一股 $x$。`, fig: { t: "rt", a: "x", b: "7", c: "10", na: 7.1, nb: 7 },
      o: [R`$\sqrt{51}$`, R`$\sqrt{149}$`, R`$3$`, R`$51$`],
      h: [R`求股：股$^2$＝斜邊$^2-$另一股$^2$。`, R`$x^2=10^2-7^2=100-49=51$。`, R`$x=\sqrt{51}$。`] },
    { q: R`以直角三角形的兩股為邊長各畫一個正方形，面積分別為 $25$ 平方公分與 $36$ 平方公分。以斜邊為邊長畫的正方形面積是多少平方公分？`,
      o: [R`$61$`, R`$11$`, R`$\sqrt{61}$`, R`$121$`],
      h: [R`正方形面積＝邊長$^2$，所以兩股正方形面積就是 $a^2$、$b^2$。`, R`斜邊正方形面積 $c^2=a^2+b^2=25+36$。`, R`答案是 $61$ 平方公分。`] },
    { q: R`如圖，長方形的長為 $12$、寬為 $5$，求對角線長。`, fig: { t: "rect", w: "12", h: "5", d: "?", nw: 12, nh: 5 },
      o: [R`$13$`, R`$17$`, R`$\sqrt{119}$`, R`$7$`],
      h: [R`對角線把長方形分成兩個直角三角形，長、寬是兩股。`, R`對角線$^2=12^2+5^2=144+25=169$。`, R`對角線 $=\sqrt{169}=13$。`] },
    { q: R`如圖，正方形邊長為 $5$，求對角線長。`, fig: { t: "sq", s: "5", d: "?" },
      o: [R`$5\sqrt{2}$`, R`$10$`, R`$\sqrt{10}$`, R`$25$`],
      h: [R`正方形的兩邊和對角線形成直角三角形，兩股都是 $5$。`, R`對角線$^2=5^2+5^2=50$。`, R`$\sqrt{50}=5\sqrt2$。`] },
    { q: R`如圖，正三角形邊長為 $4$，求它的高 $h$。`, fig: { t: "eq", s: "4" },
      o: [R`$2\sqrt{3}$`, R`$4\sqrt{3}$`, R`$2\sqrt{5}$`, R`$3$`],
      h: [R`高會把底邊平分成 $2$ 和 $2$，形成斜邊 $4$、一股 $2$ 的直角三角形。`, R`$h^2=4^2-2^2=16-4=12$。`, R`$h=\sqrt{12}=2\sqrt3$。`] },
    { q: R`正三角形邊長為 $6$，求它的面積。`, fig: { t: "eq", s: "6" },
      o: [R`$9\sqrt{3}$`, R`$18\sqrt{3}$`, R`$3\sqrt{3}$`, R`$18$`],
      h: [R`先求高：底邊一半是 $3$，$h^2=6^2-3^2=27$。`, R`$h=\sqrt{27}=3\sqrt3$，面積 $=\dfrac{6\times3\sqrt3}{2}$。`, R`面積 $=9\sqrt3$。`] },
    { q: R`如圖，直角三角形兩股為 $6$、$8$，求斜邊上的高 $h$。`, fig: { t: "rth", a: "8", b: "6", na: 8, nb: 6 },
      o: [R`$\dfrac{24}{5}$`, R`$5$`, R`$\dfrac{48}{5}$`, R`$7$`],
      h: [R`先求斜邊：$\sqrt{6^2+8^2}=10$。`, R`同一個三角形面積算兩次：$\dfrac{6\times8}{2}=\dfrac{10\times h}{2}$，即 $24=5h$。`, R`$h=\dfrac{24}{5}$。`] },
    { q: R`直角 $\triangle ABC$ 中，$\angle A=90^\circ$，$\overline{AB}=3$，$\overline{AC}=4$，求斜邊 $\overline{BC}$ 與斜邊上的高。`, lv: 2, fig: { t: "rth", a: "3", b: "4", na: 3, nb: 4 },
      o: [R`斜邊 $5$，高 $\dfrac{12}{5}$`, R`斜邊 $5$，高 $12$`, R`斜邊 $7$，高 $\dfrac{12}{7}$`, R`斜邊 $5$，高 $\dfrac{6}{5}$`],
      h: [R`斜邊 $=\sqrt{3^2+4^2}=5$。`, R`面積 $=\dfrac{3\times4}{2}=6$，也等於 $\dfrac{5\times h}{2}$。`, R`$5h=12$，$h=\dfrac{12}{5}$。`] },
    { q: R`數線上兩點 $A(3)$、$B(-1)$，求 $\overline{AB}$。`,
      o: [R`$4$`, R`$2$`, R`$-4$`, R`$3$`],
      h: [R`數線上兩點距離＝大的數 $-$ 小的數。`, R`$3-(-1)=3+1$。`, R`$\overline{AB}=4$。`] },
    { q: R`坐標平面上 $E(-3,-4)$、$F(-8,-4)$，求 $\overline{EF}$。`,
      o: [R`$5$`, R`$11$`, R`$8$`, R`$-5$`],
      h: [R`兩點的 $y$ 坐標相同，是水平線段，只要看 $x$ 坐標。`, R`$(-3)-(-8)=-3+8$。`, R`$\overline{EF}=5$。`] },
    { q: R`坐標平面上 $E(0,3)$、$F(4,0)$，求 $\overline{EF}$。`,
      o: [R`$5$`, R`$7$`, R`$\sqrt{7}$`, R`$1$`],
      h: [R`兩點距離公式：$\sqrt{(x_1-x_2)^2+(y_1-y_2)^2}$。`, R`水平差 $4$、鉛直差 $3$，$\overline{EF}=\sqrt{4^2+3^2}=\sqrt{25}$。`, R`$\overline{EF}=5$。`] },
    { q: R`坐標平面上 $G(5,1)$、$H(1,-3)$，求 $\overline{GH}$。`,
      o: [R`$4\sqrt{2}$`, R`$8$`, R`$2\sqrt{2}$`, R`$4$`],
      h: [R`算水平差與鉛直差：$5-1=4$，$1-(-3)=4$。`, R`$\overline{GH}=\sqrt{4^2+4^2}=\sqrt{32}$。`, R`$\sqrt{32}=4\sqrt2$。`] },
    { q: R`將長 $17$ 公尺的竹竿斜靠在垂直的牆上，竿腳到牆腳的距離是 $8$ 公尺，竿頂離地面多少公尺？`,
      o: [R`$15$`, R`$9$`, R`$\sqrt{353}$`, R`$25$`],
      h: [R`竹竿、牆、地面形成直角三角形，竹竿是斜邊。`, R`高$^2=17^2-8^2=289-64=225$。`, R`高 $=\sqrt{225}=15$ 公尺。`] },
    { q: R`$2.5$ 公尺長的梯子靠在垂直的牆上，梯腳離牆腳 $0.7$ 公尺。若梯腳再往外滑 $1.3$ 公尺，梯頂下移多少公尺？`, lv: 2,
      o: [R`$0.9$`, R`$1.3$`, R`$1.5$`, R`$2.4$`],
      h: [R`先算原來梯頂高度：$\sqrt{2.5^2-0.7^2}=\sqrt{5.76}=2.4$。`, R`滑後梯腳離牆 $0.7+1.3=2$，新高度 $\sqrt{2.5^2-2^2}=\sqrt{2.25}=1.5$。`, R`下移 $2.4-1.5=0.9$ 公尺。`] }
  ]
},
{
  id: 3, title: "3-1 因式分解", subtitle: "因式與倍式、提出公因式（提・去・併）、變號、平方差與和差平方公式",
  practice: [
    { q: R`下列何者是 $x^2+6x+8$ 的因式？`,
      o: [R`$x+2$`, R`$x+3$`, R`$x-2$`, R`$x+6$`],
      h: [R`用除法檢查：除完餘式為 $0$，就是因式。`, R`$(x^2+6x+8)\div(x+2)=x+4$，餘式 $0$。`, R`$x^2+6x+8=(x+2)(x+4)$，答案是 $x+2$。`] },
    { q: R`若 $12x^2+5x-2$ 可因式分解為 $(3x+2)(ax+b)$，則 $a$、$b$ 各為多少？`,
      o: [R`$a=4$，$b=-1$`, R`$a=4$，$b=1$`, R`$a=3$，$b=-1$`, R`$a=-4$，$b=1$`],
      h: [R`看首項：$3x\cdot ax=12x^2$，所以 $3a=12$。`, R`$a=4$；再看末項：$2\cdot b=-2$。`, R`$b=-1$，答案 $a=4$、$b=-1$。`] },
    { q: R`下列何者「不是」$2x^2$ 和 $6x$ 的公因式？`,
      o: [R`$2x^2$`, R`$2$`, R`$x$`, R`$2x$`],
      h: [R`拆開來看：$2x^2=2\cdot x\cdot x$，$6x=2\cdot3\cdot x$。`, R`兩個式子共同有的是 $2$、$x$、$2x$（以及 $1$）。`, R`$2x^2$ 不是 $6x$ 的因式，所以答案是 $2x^2$。`] },
    { q: R`因式分解 $3x^2-15x$。`,
      o: [R`$3x(x-5)$`, R`$3(x^2-5x)$`, R`$x(3x-15)$`, R`$3x(x-15)$`],
      h: [R`找數字的公因數和文字的公因式，要提「最大」的。`, R`公因式是 $3x$：$3x^2\div3x=x$，$15x\div3x=5$。`, R`答案 $3x(x-5)$。`] },
    { q: R`因式分解 $x(3x-2)-x(x+1)$。`,
      o: [R`$x(2x-3)$`, R`$x(2x-1)$`, R`$x(4x-1)$`, R`$x(2x+3)$`],
      h: [R`提：公因式是 $x$，寫成 $x[(3x-2)-(x+1)]$。`, R`去：去括號 $3x-2-x-1$（減號後面要變號）。`, R`併：$2x-3$，答案 $x(2x-3)$。`] },
    { q: R`因式分解 $(2x+7)(4x-5)-(3x+2)(2x+7)$。`,
      o: [R`$(2x+7)(x-7)$`, R`$(2x+7)(x-3)$`, R`$(2x+7)(7x-3)$`, R`$(2x+7)(x+7)$`],
      h: [R`提：公因式是 $(2x+7)$，寫成 $(2x+7)[(4x-5)-(3x+2)]$。`, R`去：$4x-5-3x-2$。`, R`併：$x-7$，答案 $(2x+7)(x-7)$。`] },
    { q: R`因式分解 $3(x+1)+x(x+1)$。`,
      o: [R`$(x+1)(x+3)$`, R`$3x(x+1)$`, R`$(x+1)(3x+1)$`, R`$(x+1)^2+3$`],
      h: [R`公因式是 $(x+1)$。`, R`提出後剩下 $3$ 和 $x$：$(x+1)(3+x)$。`, R`答案 $(x+1)(x+3)$。`] },
    { q: R`因式分解 $(3x-4)^2-(3x-4)$。`,
      o: [R`$(3x-4)(3x-5)$`, R`$(3x-4)(3x-3)$`, R`$(3x-4)^2$`, R`$(3x-4)(3x+5)$`],
      h: [R`把 $(3x-4)^2$ 看成 $(3x-4)(3x-4)$，後面的 $(3x-4)$ 看成 $1\cdot(3x-4)$。`, R`提出 $(3x-4)$：$(3x-4)[(3x-4)-1]$。`, R`答案 $(3x-4)(3x-5)$。`] },
    { q: R`因式分解 $x(x-1)-(1-x)$。`,
      o: [R`$(x-1)(x+1)$`, R`$(x-1)^2$`, R`$x(x-1)$`, R`$(x-1)(x-2)$`],
      h: [R`先變號：$-(1-x)=+(x-1)$。`, R`算式變成 $x(x-1)+1\cdot(x-1)$，提出 $(x-1)$。`, R`答案 $(x-1)(x+1)$。`] },
    { q: R`$(2-x)^2$ 等於下列何者？`,
      o: [R`$(x-2)^2$`, R`$-(x-2)^2$`, R`$(x+2)^2$`, R`$-(x+2)^2$`],
      h: [R`$(2-x)=-(x-2)$。`, R`平方後：$[-(x-2)]^2$，負負得正。`, R`$(2-x)^2=+(x-2)^2$。`] },
    { q: R`因式分解 $x^2-16$。`,
      o: [R`$(x+4)(x-4)$`, R`$(x-4)^2$`, R`$(x+8)(x-8)$`, R`$(x+16)(x-1)$`],
      h: [R`平方差公式：$a^2-b^2=(a+b)(a-b)$。`, R`$x^2-16=x^2-4^2$。`, R`答案 $(x+4)(x-4)$。`] },
    { q: R`因式分解 $9x^2-16y^2$。`,
      o: [R`$(3x+4y)(3x-4y)$`, R`$(9x+16y)(x-y)$`, R`$(3x-4y)^2$`, R`$(9x+4y)(x-4y)$`],
      h: [R`平方差公式：$a^2-b^2=(a+b)(a-b)$。`, R`$9x^2-16y^2=(3x)^2-(4y)^2$。`, R`答案 $(3x+4y)(3x-4y)$。`] },
    { q: R`因式分解 $2a^2-8$。`,
      o: [R`$2(a+2)(a-2)$`, R`$2(a^2-4)$`, R`$(2a+4)(a-2)$`, R`$2(a-2)^2$`],
      h: [R`先提出公因數 $2$：$2(a^2-4)$。`, R`括號裡還能用平方差：$a^2-4=a^2-2^2$。`, R`答案 $2(a+2)(a-2)$（要分解到不能再分解）。`] },
    { q: R`因式分解 $(x+1)^2-9$。`,
      o: [R`$(x+4)(x-2)$`, R`$(x+4)(x+2)$`, R`$(x-4)(x+2)$`, R`$(x+10)(x-8)$`],
      h: [R`把 $(x+1)$ 看成一整塊：$(x+1)^2-3^2$。`, R`平方差：$[(x+1)+3][(x+1)-3]$。`, R`答案 $(x+4)(x-2)$。`] },
    { q: R`因式分解 $x^2-10x+25$。`,
      o: [R`$(x-5)^2$`, R`$(x+5)^2$`, R`$(x+5)(x-5)$`, R`$(x-25)(x+1)$`],
      h: [R`差的平方公式：$a^2-2ab+b^2=(a-b)^2$。`, R`$x^2-10x+25=x^2-2\cdot x\cdot5+5^2$。`, R`答案 $(x-5)^2$。`] },
    { q: R`因式分解 $9x^2+12x+4$。`,
      o: [R`$(3x+2)^2$`, R`$(9x+2)^2$`, R`$(3x+4)^2$`, R`$(3x-2)^2$`],
      h: [R`和的平方公式：$a^2+2ab+b^2=(a+b)^2$。`, R`$9x^2+12x+4=(3x)^2+2\cdot(3x)\cdot2+2^2$。`, R`答案 $(3x+2)^2$。`] },
    { q: R`因式分解 $3x^2+12x+12$。`,
      o: [R`$3(x+2)^2$`, R`$(3x+2)^2$`, R`$3(x+4)^2$`, R`$3(x+2)(x-2)$`],
      h: [R`先提出公因數 $3$：$3(x^2+4x+4)$。`, R`$x^2+4x+4=x^2+2\cdot x\cdot2+2^2$。`, R`答案 $3(x+2)^2$。`] },
    { q: R`因式分解 $9(2x-5)^2+6(2x-5)+1$。`, lv: 2,
      o: [R`$4(3x-7)^2$`, R`$(3x-7)^2$`, R`$(6x-15)^2$`, R`$(6x+14)^2$`],
      h: [R`令 $A=2x-5$，原式 $=9A^2+6A+1=(3A)^2+2\cdot(3A)\cdot1+1^2$。`, R`$=(3A+1)^2=[3(2x-5)+1]^2=(6x-14)^2$。`, R`$6x-14=2(3x-7)$，所以 $(6x-14)^2=4(3x-7)^2$。`] }
  ]
},
{
  id: 4, title: "3-2 十字交乘法", subtitle: "找相乘與相加的兩數、二次項係數為 1 與不為 1 的十字交乘",
  practice: [
    { q: R`相乘等於 $12$、相加等於 $-7$ 的兩個數是哪一組？`,
      o: [R`$-3$、$-4$`, R`$3$、$4$`, R`$-2$、$-6$`, R`$-12$、$-1$`],
      h: [R`相乘是正的 → 兩數同號；相加是負的 → 兩數都是負的。`, R`列出 $12$ 的拆法：$(-1)(-12)$、$(-2)(-6)$、$(-3)(-4)$，看誰相加是 $-7$。`, R`$(-3)+(-4)=-7$，答案 $-3$、$-4$。`] },
    { q: R`因式分解 $x^2+7x+10$。`,
      o: [R`$(x+2)(x+5)$`, R`$(x+1)(x+10)$`, R`$(x-2)(x-5)$`, R`$(x+3)(x+4)$`],
      h: [R`找兩數：相乘 $=10$、相加 $=7$。`, R`$2\times5=10$，$2+5=7$。`, R`答案 $(x+2)(x+5)$。`] },
    { q: R`因式分解 $x^2+13x+36$。`,
      o: [R`$(x+4)(x+9)$`, R`$(x+6)(x+6)$`, R`$(x+3)(x+12)$`, R`$(x+2)(x+18)$`],
      h: [R`找兩數：相乘 $=36$、相加 $=13$。`, R`$4\times9=36$，$4+9=13$。`, R`答案 $(x+4)(x+9)$。`] },
    { q: R`因式分解 $x^2-5x+6$。`,
      o: [R`$(x-2)(x-3)$`, R`$(x+2)(x+3)$`, R`$(x-1)(x-6)$`, R`$(x+2)(x-3)$`],
      h: [R`相乘 $=+6$、相加 $=-5$，兩數都是負的。`, R`$(-2)\times(-3)=6$，$(-2)+(-3)=-5$。`, R`答案 $(x-2)(x-3)$。`] },
    { q: R`因式分解 $x^2-8x-20$。`,
      o: [R`$(x-10)(x+2)$`, R`$(x+10)(x-2)$`, R`$(x-4)(x+5)$`, R`$(x-5)(x+4)$`],
      h: [R`相乘 $=-20$ → 一正一負；相加 $=-8$ → 負的那個數比較大（絕對值）。`, R`$(-10)\times2=-20$，$(-10)+2=-8$。`, R`答案 $(x-10)(x+2)$。`] },
    { q: R`因式分解 $x^2-x-20$。`,
      o: [R`$(x-5)(x+4)$`, R`$(x+5)(x-4)$`, R`$(x-10)(x+2)$`, R`$(x-20)(x+1)$`],
      h: [R`相乘 $=-20$、相加 $=-1$，一正一負且負的較大。`, R`$(-5)\times4=-20$，$(-5)+4=-1$。`, R`答案 $(x-5)(x+4)$。`] },
    { q: R`因式分解 $x^2+x-20$。`,
      o: [R`$(x+5)(x-4)$`, R`$(x-5)(x+4)$`, R`$(x+10)(x-2)$`, R`$(x+20)(x-1)$`],
      h: [R`相乘 $=-20$、相加 $=+1$，一正一負且正的較大。`, R`$5\times(-4)=-20$，$5+(-4)=1$。`, R`答案 $(x+5)(x-4)$。`] },
    { q: R`因式分解 $x^2+15xy+26y^2$。`,
      o: [R`$(x+2y)(x+13y)$`, R`$(x+y)(x+26y)$`, R`$(x+2y)(x-13y)$`, R`$(x+13)(x+2)$`],
      h: [R`把 $y$ 一起帶著：找兩數相乘 $=26$、相加 $=15$。`, R`$2\times13=26$，$2+13=15$。`, R`答案 $(x+2y)(x+13y)$。`] },
    { q: R`因式分解 $x^2+2xy-15y^2$。`,
      o: [R`$(x+5y)(x-3y)$`, R`$(x-5y)(x+3y)$`, R`$(x+15y)(x-y)$`, R`$(x+3y)(x+5y)$`],
      h: [R`找兩數相乘 $=-15$、相加 $=+2$。`, R`$5\times(-3)=-15$，$5+(-3)=2$。`, R`答案 $(x+5y)(x-3y)$。`] },
    { q: R`因式分解 $2x^2+15x+7$。`,
      o: [R`$(x+7)(2x+1)$`, R`$(2x+7)(x+1)$`, R`$(x+7)(2x-1)$`, R`$(2x+1)(x-7)$`],
      h: [R`十字交乘：$2x^2$ 拆成 $x$ 與 $2x$；$7$ 拆成 $7$ 與 $1$。`, R`試 $(x+7)(2x+1)$：交叉相乘 $x\cdot1+2x\cdot7=x+14x=15x$ ✓。`, R`答案 $(x+7)(2x+1)$。`] },
    { q: R`因式分解 $3x^2-7x+2$。`,
      o: [R`$(x-2)(3x-1)$`, R`$(x-1)(3x-2)$`, R`$(x+2)(3x+1)$`, R`$(3x-2)(x+1)$`],
      h: [R`$3x^2$ 拆 $x$ 與 $3x$；$+2$ 而中間項是負的，所以拆成 $-2$ 與 $-1$。`, R`試 $(x-2)(3x-1)$：交叉 $x\cdot(-1)+3x\cdot(-2)=-x-6x=-7x$ ✓。`, R`答案 $(x-2)(3x-1)$。`] },
    { q: R`因式分解 $6x^2-7x-20$。`,
      o: [R`$(2x-5)(3x+4)$`, R`$(2x+5)(3x-4)$`, R`$(6x-5)(x+4)$`, R`$(3x-5)(2x+4)$`],
      h: [R`$6x^2$ 拆成 $2x$ 與 $3x$；$-20$ 要拆成一正一負。`, R`試 $(2x-5)(3x+4)$：交叉 $2x\cdot4+3x\cdot(-5)=8x-15x=-7x$ ✓。`, R`答案 $(2x-5)(3x+4)$。`] },

function computeWeakSkills() {
  const tally = {};
  mistakes.forEach(m => {
    const info = SKILL_OF[m.q]; if (!info) return;
    const k = info.skill; tally[k] = tally[k] || { skill: k, modIdx: info.modIdx, now: 0, total: 0 };
    tally[k].now++;
  });
  Object.entries(mistakeLog).forEach(([q, v]) => {
    const info = SKILL_OF[q]; if (!info || !tally[info.skill]) return;
    tally[info.skill].total += v.count || 1;
  });
  return Object.values(tally).sort((a, b) => b.now - a.now || b.total - a.total);
}
function progressChartSVG() {
  const mods = appData.modules, W = 620, H = 330, L = 46, R = 12, T = 18, B = 286;
  const pw = W - L - R, gw = pw / mods.length, bw = Math.min(34, gw * 0.28);
  const y = v => B - (B - T) * v / 100;
  let g = "";
  for (let v = 0; v <= 100; v += 20) g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="#e7e5e4" stroke-width="1"/><text x="${L - 8}" y="${y(v) + 4}" font-size="14" fill="#78716c" text-anchor="end">${v}</text>`;
  mods.forEach((m, i) => {
    const s = scores[i], max = m.practice.length, cx = L + gw * i + gw / 2;
    const f = s ? Math.round(s.first / max * 100) : 0, b = s ? Math.round(s.best / max * 100) : 0;
    const bar = (x, v, c) => `<rect x="${x}" y="${y(v)}" width="${bw}" height="${B - y(v)}" rx="5" fill="${c}"/>${s ? `<text x="${x + bw / 2}" y="${y(v) - 6}" font-size="13" font-weight="700" fill="#57534e" text-anchor="middle">${v}</text>` : ""}`;
    g += bar(cx - bw - 3, f, "#d6d3d1") + bar(cx + 3, b, "#10b981");
    g += `<text x="${cx}" y="${B + 22}" font-size="16" font-weight="700" fill="#57534e" text-anchor="middle">${m.title.split(" ")[0]}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" class="w-full h-auto" role="img" aria-label="各單元首次與最佳答對率">
    ${g}
    <line x1="${L}" x2="${W - R}" y1="${B}" y2="${B}" stroke="#a8a29e" stroke-width="1.2"/></svg>
    <div class="flex justify-center gap-6 text-sm font-bold text-stone-600 mt-1">
      <span class="flex items-center gap-2"><span class="w-10 h-3 rounded bg-stone-300"></span>首次挑戰</span>
      <span class="flex items-center gap-2"><span class="w-10 h-3 rounded bg-emerald-500"></span>最佳表現</span></div>`;
}

function figSVG(f, forPrint) {
  if (!f) return "";
  const ink = forPrint ? "#111" : "#44403c", fill = forPrint ? "none" : "#fef3c7", lab = forPrint ? "#111" : "#b45309";
  const T = (x, y, s, anchor = "middle") => `<text x="${x}" y="${y}" font-size="15" font-weight="700" fill="${lab}" text-anchor="${anchor}" font-family="Times New Roman, serif" font-style="italic">${s}</text>`;
  if (f.t === "rt") {
    const k = 120 / Math.max(f.na, f.nb), w = f.nb * k, h = f.na * k, x0 = 30, y0 = 20;
    const B = [x0, y0 + h], C = [x0 + w, y0 + h], A = [x0 + w, y0];
    return `<svg viewBox="0 0 ${w + 70} ${h + 50}"><polygon points="${A} ${B} ${C}" fill="${fill}" stroke="${ink}" stroke-width="2"/>
      <polyline points="${C[0] - 12},${C[1]} ${C[0] - 12},${C[1] - 12} ${C[0]},${C[1] - 12}" fill="none" stroke="${ink}" stroke-width="1.5"/>
      ${T(A[0] + 10, y0 + h / 2 + 5, f.a, "start")}${T(x0 + w / 2, y0 + h + 22, f.b)}${T(x0 + w / 2 - 12, y0 + h / 2 - 4, f.c, "end")}</svg>`;
  }
  if (f.t === "rth") {
    const k = 120 / Math.max(f.na, f.nb), w = f.nb * k, h = f.na * k, x0 = 30, y0 = 20;
    const A = [x0, y0], B = [x0, y0 + h], C = [x0 + w, y0 + h];
    const ux = C[0] - A[0], uy = C[1] - A[1], t = ((B[0] - A[0]) * ux + (B[1] - A[1]) * uy) / (ux * ux + uy * uy);
    const D = [A[0] + t * ux, A[1] + t * uy];
    return `<svg viewBox="0 0 ${w + 60} ${h + 50}"><polygon points="${A} ${B} ${C}" fill="${fill}" stroke="${ink}" stroke-width="2"/>
      <polyline points="${B[0]},${B[1] - 12} ${B[0] + 12},${B[1] - 12} ${B[0] + 12},${B[1]}" fill="none" stroke="${ink}" stroke-width="1.5"/>
      <line x1="${B[0]}" y1="${B[1]}" x2="${D[0]}" y2="${D[1]}" stroke="${ink}" stroke-width="1.8" stroke-dasharray="5 4"/>
      ${T(x0 - 8, y0 + h / 2 + 5, f.a, "end")}${T(x0 + w / 2, y0 + h + 22, f.b)}${T((B[0] + D[0]) / 2 + 4, (B[1] + D[1]) / 2 + 16, "h", "start")}</svg>`;
  }
  if (f.t === "eq") {
    const s = 130, h = s * Math.sqrt(3) / 2, x0 = 25, y0 = 15, A = [x0 + s / 2, y0], B = [x0, y0 + h], C = [x0 + s, y0 + h];
    return `<svg viewBox="0 0 ${s + 50} ${h + 45}"><polygon points="${A} ${B} ${C}" fill="${fill}" stroke="${ink}" stroke-width="2"/>
      <line x1="${A[0]}" y1="${A[1]}" x2="${A[0]}" y2="${B[1]}" stroke="${ink}" stroke-width="1.6" stroke-dasharray="5 4"/>
      ${T(x0 + s / 4 - 10, y0 + h / 2 + 4, f.s, "end")}${T(x0 + 3 * s / 4 + 10, y0 + h / 2 + 4, f.s, "start")}${T(x0 + s / 2, y0 + h + 22, f.s)}${T(A[0] + 6, y0 + h * 0.7, "h", "start")}</svg>`;
  }
  if (f.t === "sq") {
    const s = 110, x0 = 30, y0 = 25;
    return `<svg viewBox="0 0 ${s + 60} ${s + 45}"><rect x="${x0}" y="${y0}" width="${s}" height="${s}" fill="${fill}" stroke="${ink}" stroke-width="2"/>
      <line x1="${x0}" y1="${y0 + s}" x2="${x0 + s}" y2="${y0}" stroke="${ink}" stroke-width="1.8"/>
      ${T(x0 + s / 2, y0 - 8, f.s)}${T(x0 - 8, y0 + s / 2 + 5, f.s, "end")}${T(x0 + s / 2 + 12, y0 + s / 2 + 14, f.d, "start")}</svg>`;
  }
  if (f.t === "rect") {
    const k = 150 / f.nw, w = f.nw * k, h = f.nh * k, x0 = 30, y0 = 25;
    return `<svg viewBox="0 0 ${w + 60} ${h + 45}"><rect x="${x0}" y="${y0}" width="${w}" height="${h}" fill="${fill}" stroke="${ink}" stroke-width="2"/>
      <line x1="${x0}" y1="${y0 + h}" x2="${x0 + w}" y2="${y0}" stroke="${ink}" stroke-width="1.8"/>
      ${T(x0 + w / 2, y0 - 8, f.w)}${T(x0 - 8, y0 + h / 2 + 5, f.h, "end")}${T(x0 + w / 2 + 10, y0 + h / 2 + 18, f.d, "start")}</svg>`;
  }
  return "";
}

// 每題結果分成：solo 沒看提示答對／hinted 看 1～2 步答對（以上兩種＝獨立答對，計分）
//              full 看完 3 步才答對（不計分）／wrongNo 沒看提示答錯／wrongHint 有看提示答錯
function selectHintOption(modIdx, qIdx, oIdx) {
  const st = qState[qIdx]; if (st.answered) return;
  const qd = currentModuleData[qIdx], isCorrect = qd.shuffled[oIdx] === qd.correctStr;
  const used = st.hintsShown;
  st.answered = true; st.selectedOption = oIdx; st.correct = isCorrect; st.hintsUsed = used;
  st.cat = isCorrect ? (used === 0 ? "solo" : used < 3 ? "hinted" : "full") : (used === 0 ? "wrongNo" : "wrongHint");
  const indep = st.cat === "solo" || st.cat === "hinted";
  const fb = document.getElementById(`feedback-${qIdx}`);
  fb.classList.remove("hidden");
  document.getElementById(`btn-${qIdx}-${oIdx}`).classList.add(isCorrect ? "btn-correct" : "btn-wrong");
  const isReview = /^review/.test(String(modIdx));
  let extra = "";
  if (indep) {
    currentModuleCorrectCount++;
    if (isReview) { const r = promoteMistake(qd.q); extra = r === "slain" ? "💥 健忘怪物被你消滅了！這題從錯題清單移除。" : r ? `👍 移到${STAGE_INFO[r].short}，${fmtTime(nowTs() + STAGE_INFO[r].wait)} 解鎖再戰。` : ""; }

    fb.className = "mt-6 text-base font-bold text-center py-4 rounded-2xl bg-green-100 text-green-800 fade-in";
  } else if (isCorrect) {

    fb.innerHTML = `✅ 答案正確，但因為看完 3 步提示，<b>不計入得分</b>。<span class="text-xs block mt-1 opacity-80">${isReview ? "怪物逃回第一關，再練一次吧！" : "已放進錯題重練第一關。"}</span>`;
    fb.className = "mt-6 text-base font-bold text-center py-4 rounded-2xl bg-amber-100 text-amber-800 fade-in";
  } else {
    addToMistakes(modIdx, qd);
    const ci = qd.shuffled.indexOf(qd.correctStr);
    document.getElementById(`btn-${qIdx}-${ci}`).classList.add("btn-correct");
    fb.innerHTML = `❌ 再想想！正確答案已標示為綠色，上面有完整解題步驟。<span class="text-xs block mt-1 opacity-80">${isReview ? "怪物逃回第一關。" : "已放進錯題重練第一關。"}</span>`;
    fb.className = "mt-6 text-base font-bold text-center py-4 rounded-2xl bg-rose-100 text-rose-800 fade-in";

  updateQuestionUI(qIdx);
  document.getElementById("score-badge").textContent = `獨立答對: ${currentModuleCorrectCount}/${currentModuleData.length}`;
  checkModuleCompletion(modIdx);
}
function checkModuleCompletion(modIdx) {

  studentHistory.push({ moduleId: modIdx, moduleTitle: title, score: currentModuleCorrectCount, maxScore: max, timestamp: Date.now(), v: 2, ...rec });
  saveLocalAll(); syncDataToCloud();
  const p = currentModuleCorrectCount / max;
  document.getElementById("final-msg").textContent = `完成！獨立答對 ${currentModuleCorrectCount}/${max} ${p === 1 ? "🏆 全對！" : p >= .8 ? "👍 很棒！" : "💪 再接再厲！"}`;

async function fetchAllStudentRecords() {
  if (!db) return null;
  const snap = await fs.getDocs(fs.collection(db, "artifacts", appId, "public", "data", COLLECTION_NAME));
  const groups = {};
  snap.forEach(d => { const r = d.data(); if (!r || r.mergedInto) return; const k = canonKey(r.studentSeat, r.studentName); (groups[k] = groups[k] || []).push(r); });
  // 同一位學生如果有不同寫法的紀錄（學生尚未重新登入），先在後台合併顯示
  const out = Object.values(groups).map(rs => rs.length === 1 ? { ...rs[0], studentSeat: normSeat(rs[0].studentSeat), studentName: normName(rs[0].studentName) } : mergeRecords(rs));
  return out.sort((a, b) => (parseInt(a.studentSeat) || 0) - (parseInt(b.studentSeat) || 0));
}
function mergeRecords(rs) {
  const out = { studentId: rs[0].studentId, studentSeat: normSeat(rs[0].studentSeat), studentName: normName(rs[0].studentName), scores: {}, mistakes: [], slain: {}, mistakeLog: {}, history: [], lastUpdated: 0 };
  rs.forEach(r => {
    Object.entries(r.scores || {}).forEach(([k, v]) => { const l = out.scores[k]; out.scores[k] = l ? { first: Math.min(l.first, v.first), best: Math.max(l.best, v.best), n: (l.n || 1) + (v.n || 1) } : v; });
    Object.assign(out.slain, r.slain || {});
    (r.mistakes || []).forEach(m => { if (!out.mistakes.some(x => x.q === m.q)) out.mistakes.push(m); });
    Object.entries(r.mistakeLog || {}).forEach(([q, v]) => { if (!out.mistakeLog[q] || (v.count || 0) > out.mistakeLog[q].count) out.mistakeLog[q] = v; });
    out.history.push(...(r.history || [])); out.lastUpdated = Math.max(out.lastUpdated, r.lastUpdated || 0);
  });
  out.history.sort((a, b) => a.timestamp - b.timestamp); out.mistakesCount = out.mistakes.length;
  return out;
}
// 學生作答統計（只算改版後有細項的紀錄）
function recStats(r, modFilter) {
  // 沒指定單元時只統計單元測驗（不含錯題重練）
  const hs = (r.history || []).filter(h => modFilter === undefined ? typeof h.moduleId === "number" : String(h.moduleId) === String(modFilter));
  const v2 = hs.filter(h => h.v === 2), sum = k => v2.reduce((a, h) => a + (h[k] || 0), 0);
  return { tries: hs.length, v2: v2.length, old: hs.length - v2.length, q: v2.reduce((a, h) => a + h.maxScore, 0), indep: sum("solo") + sum("hinted"), solo: sum("solo"), hinted: sum("hinted"), full: sum("full"), wrongNo: sum("wrongNo"), wrongHint: sum("wrongHint") };
}

      ${topWrong.length ? `<ol class="space-y-2 text-sm text-stone-700 mb-5">${topWrong.map((w, k) => `<li class="flex gap-3 items-start"><span class="w-5 text-stone-400 font-bold tabular-nums">${k + 1}.</span><span class="font-black text-rose-600 whitespace-nowrap tabular-nums">${w.n} 人<span class="text-xs text-stone-400 font-bold">（${w.open}）</span></span><span class="text-stone-400 whitespace-nowrap">${mods[w.modIdx].title.split(" ")[0]}</span><span class="min-w-0">${w.q}</span></li>`).join("")}</ol>

const VERSION_INFO = {
  A: { name: "A 版", guide: "請在作答區寫出完整的計算過程，最後把答案寫在「答：」後面。", work: 38 },
  B: { name: "B 版", guide: "每題都有「第一步」提示，先照著提示起頭，再自己完成後面的計算。", work: 32 },
  C: { name: "C 版", guide: "每題都有「第一步」和「第二步」提示，照著步驟做，最後一步請自己完成並寫出答案。", work: 22 }
};
function buildWorksheet() {
  const units = [...document.querySelectorAll(".ps-unit:checked")].map(e => +e.value);
  if (!units.length) { document.getElementById("ps-error").classList.remove("hidden"); return; }
  const ver = document.querySelector('input[name="ps-ver"]:checked').value;
  const withAdv = document.getElementById("ps-adv").checked;
  const groups = units.map(mi => { const m = appData.modules[mi]; return { title: `${m.title}　單元學習單`, subtitle: `八年級數學・${m.subtitle}`, items: m.practice.filter(q => withAdv || q.lv !== 2).map(q => ({ q, unit: m.title })) }; });
  closePrintSetup();
  renderSheets(groups, ver, document.getElementById("ps-opts").checked, document.getElementById("ps-key").checked, units.map(i => appData.modules[i].title.split(" ")[0]).join("、"));
}

// groups: [{ title, subtitle, items: [{ q, unit, wrongN?, unitTag? }] }]
function renderSheets(groups, ver, withOpts, withKey, summary) {
  const vi = VERSION_INFO[ver];
  const nh = ver === "A" ? 0 : ver === "B" ? 1 : 2;
  const stepNames = ["第一步", "第二步"];
  const letters = ["(A)", "(B)", "(C)", "(D)"];
  const hasWrong = groups.some(g => g.items.some(it => it.wrongN !== undefined));
  let html = "", keyRows = [];
  groups.forEach(g => {
    const body = g.items.map((it, n) => {
      const q = it.q;
      const ordered = withOpts ? seededShuffle(q.options, q.q) : null; // 選項順序以題目為種子，每次列印都一樣
      keyRows.push({ unit: it.unit, n: n + 1, ans: ordered ? `${letters[ordered.indexOf(q.correctStr)]} ${q.correctStr}` : q.correctStr, how: q.hints[2], wrongN: it.wrongN });
      return `<div class="pq ${q.fig ? "pq-g" : ""}"><div class="pq-main">
        <div class="pq-head"><span class="pq-no">${n + 1}.</span><div>${it.unitTag ? `<span class="pq-adv" style="margin:0 6px 0 0">${it.unitTag}</span>` : ""}${q.q}${q.lv === 2 ? `<span class="pq-adv">★進階</span>` : ""}</div></div>
        ${ordered ? `<div class="pq-opts">${ordered.map((o, k) => `<span>${letters[k]} ${o}</span>`).join("")}</div>` : ""}
        ${q.hints.slice(0, nh).map((h, k) => `<div class="pq-hint"><b>${stepNames[k]}</b>${h}</div>`).join("")}
        <div class="pq-work" style="height:${q.fig && vi.work < 30 ? 30 : vi.work}mm">${ver === "C" ? `<span style="font-size:10pt;color:#555">最後一步：</span>` : ""}<div class="ans">答：<span>&nbsp;</span></div></div>
      </div>${q.fig ? `<div class="pq-fig">${figSVG(q.fig, true)}</div>` : ""}</div>`;
    }).join("");
    html += `<section class="sheet">
      <div class="sheet-head">
        <div><div class="sheet-title">${g.title}<span class="ver-tag">${vi.name}</span></div>
        <div class="sheet-sub">${g.subtitle}</div></div>
        <div class="sheet-fields">班級 <span></span> 座號 <span style="min-width:10mm"></span> 姓名 <span style="min-width:26mm"></span></div>
      </div>
      <div class="sheet-guide">📝 ${vi.guide}${withOpts ? "（請把選項代號寫在「答：」後面）" : ""}</div>
      ${body}
    </section>`;
  });
  if (withKey) {
    html += `<section class="sheet"><div class="sheet-head"><div><div class="sheet-title">解答（教師用）<span class="ver-tag">${vi.name}</span></div><div class="sheet-sub">關鍵步驟即網站上的第 3 個提示${hasWrong ? "；「答錯人數」為曾答錯（或用完提示）的學生數" : ""}</div></div></div>
      <table class="key-table"><thead><tr><th style="width:16%">單元</th><th style="width:6%">題</th>${hasWrong ? `<th style="width:9%">答錯人數</th>` : ""}<th style="width:28%">答案</th><th>關鍵步驟</th></tr></thead><tbody>
      ${keyRows.map(r => `<tr><td>${r.unit}</td><td>${r.n}</td>${hasWrong ? `<td>${r.wrongN ?? ""} 人</td>` : ""}<td>${r.ans}</td><td>${r.how}</td></tr>`).join("")}</tbody></table></section>`;
  }
  const root = document.getElementById("print-root");
  root.innerHTML = html;
  document.getElementById("print-summary").textContent = `學習單預覽｜${vi.name}｜${summary}`;
  document.getElementById("print-overlay").classList.remove("hidden");
  document.getElementById("print-overlay").scrollTop = 0;
  document.body.style.overflow = "hidden";
  triggerKatex(root);
}

function printClassMistakes() {
  const nSel = document.getElementById("cw-count").value;
  const ver = document.querySelector('input[name="cw-ver"]:checked').value;
  const list = nSel === "all" ? classWrongList : classWrongList.slice(0, +nSel);
  if (!list.length) return;
  const items = list.map(w => ({ q: w.data, unit: appData.modules[w.modIdx].title, unitTag: appData.modules[w.modIdx].title.split(" ")[0], wrongN: w.n }));
  const today = new Date().toLocaleDateString("zh-TW");
  renderSheets([{ title: "全班常錯題　補強學習單", subtitle: `八年級數學 2-2～3-2・依全班作答紀錄統計最常錯的 ${items.length} 題（${today}）`, items }], ver,
    document.getElementById("cw-opts").checked, document.getElementById("cw-key").checked, `全班常錯題 ${items.length} 題`);
}

function seededShuffle(arr, seedStr) {
  let h = 2166136261; for (const c of seedStr) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); }
  const rnd = () => { h = Math.imul(h ^ (h >>> 15), 2246822507); h = Math.imul(h ^ (h >>> 13), 3266489909); h ^= h >>> 16; return (h >>> 0) / 4294967296; };
  const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a;
}

function monsterPanel() {
  const t = nowTs(), b = stageBuckets(mistakes, t), killed = Object.keys(slain).length;
  if (!mistakes.length && !killed) return "";
  const nextLock = [1, 2, 3].flatMap(s => b[s].locked).sort((x, y) => x.due - y.due)[0];
  const cell = s => `<div class="bg-white rounded-2xl px-3 py-3 text-center"><div class="text-2xl">${STAGE_INFO[s].icon}</div><div class="text-xs font-black text-stone-500 mt-1">${STAGE_INFO[s].short}</div><div class="text-xl font-black text-stone-800 tabular-nums">${b[s].ready.length + b[s].locked.length}</div><div class="text-[11px] ${b[s].ready.length ? "text-rose-600 font-bold" : "text-stone-400"}">${b[s].ready.length ? `可挑戰 ${b[s].ready.length}` : b[s].locked.length ? "鎖定中" : "—"}</div></div>`;
  return `<section class="rounded-[36px] bg-rose-50 border border-rose-100 p-6 sm:p-8">
    <div class="flex flex-wrap items-center justify-between gap-3 mb-4"><h2 class="text-2xl font-black text-rose-900 flex items-center gap-3"><span>👾</span>消滅健忘怪物</h2>
      <div class="text-sm font-bold text-emerald-700 bg-white rounded-2xl px-4 py-2">🏆 已消滅 ${killed} 隻</div></div>
    <p class="text-sm text-rose-900/80 mb-4">錯題要在當下、2 天後、5 天後都獨立答對，才算真正記住。${nextLock ? `下一隻怪物 ${fmtTime(nextLock.due)} 解鎖（${fmtLeft(nextLock.due - t)}）。` : ""}</p>

  </section>`;
}
