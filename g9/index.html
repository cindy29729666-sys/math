<style>
  body { font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif; background:#fafaf9; color:#292524; }
  .fade-in { animation: fadeIn .25s ease-out; }
  @keyframes fadeIn { from { opacity:.3; transform: translateY(4px);} to {opacity:1; transform:none;} }
  @media (prefers-reduced-motion: reduce) { .fade-in { animation:none; } }
  .btn-correct { background:#dcfce7 !important; border-color:#22c55e !important; color:#166534 !important; }
  .btn-wrong { background:#fee2e2 !important; border-color:#ef4444 !important; color:#991b1b !important; }
  .katex { font-size: 1.08em; }
  .fig svg { max-width:100%; height:auto; }
  button:focus-visible, input:focus-visible { outline: 3px solid #f59e0b; outline-offset: 2px; }

  /* ===== 學習單預覽與列印 ===== */
  #print-overlay { position: fixed; inset: 0; z-index: 80; background: #57534e; overflow-y: auto; }
  .sheet { background: #fff; color:#111; width: 210mm; max-width: calc(100% - 24px); margin: 16px auto; padding: 14mm 14mm 12mm; box-shadow: 0 6px 24px rgba(0,0,0,.35); font-size: 11.5pt; line-height: 1.55; }
  .sheet-head { display:flex; justify-content:space-between; align-items:flex-end; gap:12px; border-bottom: 2px solid #111; padding-bottom: 6px; margin-bottom: 10px; flex-wrap: wrap; }
  .sheet-title { font-size: 16pt; font-weight: 800; letter-spacing: .02em; }
  .sheet-sub { font-size: 9.5pt; color:#444; }
  .sheet-fields { font-size: 10.5pt; display:flex; gap: 14px; white-space: nowrap; }
  .sheet-fields span { border-bottom: 1px solid #111; display:inline-block; min-width: 18mm; }
  .ver-tag { display:inline-block; border:1.5px solid #111; border-radius: 4px; padding: 0 6px; font-size: 9pt; font-weight: 700; margin-left: 6px; vertical-align: middle; }
  .sheet-guide { font-size: 9.5pt; color:#333; background:#f5f5f4; border-radius: 6px; padding: 5px 9px; margin-bottom: 8px; }
  .pq { break-inside: avoid; page-break-inside: avoid; padding: 8px 0 10px; border-bottom: 1px dashed #bbb; display: flow-root; }
  .pq-head { display:flex; gap: 6px; align-items:flex-start; }
  .pq-no { font-weight: 800; min-width: 1.8em; }
  .pq-adv { font-size: 8.5pt; border: 1px solid #111; border-radius: 3px; padding: 0 4px; margin-left: 4px; white-space: nowrap; }
  .pq-g { display: grid; grid-template-columns: minmax(0, 1fr) 40mm; gap: 10px; align-items: start; }
  .pq-fig { padding-top: 4px; }
  .pq-fig svg { width: 100%; height: auto; max-height: 44mm; }
  .pq-opts { display:flex; flex-wrap: wrap; gap: 4px 22px; margin: 4px 0 2px 2em; font-size: 10.5pt; }
  .pq-hint { margin: 5px 0 0 2em; border: 1.5px dashed #777; border-radius: 6px; padding: 3px 8px; font-size: 10.5pt; background: #fafafa; }
  .pq-hint b { margin-right: 4px; }
  .pq-work { margin: 6px 0 0 2em; position: relative; }
  .pq-work .ans { position:absolute; right: 0; bottom: 0; font-size: 10.5pt; }
  .pq-work .ans span { display:inline-block; border-bottom: 1px solid #111; min-width: 34mm; }
  .key-table { width:100%; border-collapse: collapse; font-size: 10pt; }
  .key-table td, .key-table th { border: 1px solid #999; padding: 3px 6px; vertical-align: top; text-align:left; }
  .page-break { break-before: page; page-break-before: always; }
  @page { size: A4; margin: 12mm 12mm 12mm 12mm; }
  @media print {
    body > *:not(#print-overlay) { display: none !important; }
    #print-overlay { position: static !important; background: none !important; overflow: visible !important; }
    .no-print { display: none !important; }
    .sheet { box-shadow: none; margin: 0; padding: 0; width: auto; max-width: none; }
    .sheet + .sheet { break-before: page; page-break-before: always; }
    .pq-hint { background: none; }
  }
</style>

<script>
// ===== 題庫：九年級 1-4 ~ 2-2（對齊基礎講義：概念、例題、牛刀小試；★進階題取材東南國中第二次段考 A 卷） =====
// 格式：q 題目、o 選項（第一個是正確答案，網站會自動打亂）、h 三層提示（h[0] 第一步、h[1] 第二步、h[2] 答案與說明）
// fig 圖形（可省略；本範圍用 t:"geo" 通用幾何圖）、lv: 2 代表 ★進階（段考題型）
// 數學式巨集：\seg{AB} = 線段 AB，\arc{AB} = 弧 AB
const R = String.raw;
// 幾何小工具（座標為數學座標，y 向上；圓的半徑為 1）
const pol = (d, k = 1) => [k * Math.cos(d * Math.PI / 180), k * Math.sin(d * Math.PI / 180)];
const inter = (p1, p2, p3, p4) => { const d = (p1[0]-p2[0])*(p3[1]-p4[1])-(p1[1]-p2[1])*(p3[0]-p4[0]); const a = p1[0]*p2[1]-p1[1]*p2[0], b = p3[0]*p4[1]-p3[1]*p4[0]; return [(a*(p3[0]-p4[0])-(p1[0]-p2[0])*b)/d, (a*(p3[1]-p4[1])-(p1[1]-p2[1])*b)/d]; };
const ext = (p, q, t) => [q[0] + (q[0]-p[0])*t, q[1] + (q[1]-p[1])*t];
const SIMF = (sl1, sl2) => ({
  t: "geo",
  pts: { A: [0.6, 1.8], B: [0, 0], C: [1.5, 0], H: [0.6, 0], D: [2.95, 2.4], E: [2.15, 0], F: [4.15, 0], G: [2.95, 0] },
  seg: ["AB", "BC", "CA", "AH", "DE", "EF", "FD", "DG"], ra: [["A", "H", "C"], ["D", "G", "F"]], sl: [...(sl1 || []), ...(sl2 || [])]
});

const RAW_MODULES = [
  {
    id: 1, title: "1-4 相似形的應用", subtitle: "相似三角形的高與面積、測量、特殊直角三角形、三角比",
    practice: [
      { q: R`如圖，已知 $\triangle ABC\sim\triangle DEF$，$\seg{AH}$、$\seg{DG}$ 分別為 $\seg{BC}$、$\seg{EF}$ 上的高。若 $\seg{BC}=15$，$\seg{EF}=20$，則 $\seg{AH}:\seg{DG}=$？`,
        o: [R`$3:4$`, R`$9:16$`, R`$4:3$`, R`$16:9$`],
        h: [R`兩相似三角形：<b>對應高的比＝對應邊的比</b>。`, R`$\seg{AH}:\seg{DG}=\seg{BC}:\seg{EF}=15:20$，再化成最簡整數比。`, R`$15:20=3:4$，所以 $\seg{AH}:\seg{DG}=3:4$。（$9:16$ 是面積比，不是高的比）`],
        fig: SIMF([["BC", "15", 2.1]], [["EF", "20", 2.1]]) },
      { q: R`已知 $\triangle ABC\sim\triangle DEF$，且 $\seg{AB}=8$，$\seg{DE}=12$，則 $\triangle ABC$ 與 $\triangle DEF$ 的面積比為何？`,
        o: [R`$4:9$`, R`$2:3$`, R`$16:81$`, R`$9:4$`],
        h: [R`兩相似三角形：<b>面積比＝邊長比的平方</b>。`, R`邊長比 $\seg{AB}:\seg{DE}=8:12=2:3$，面積比 $=2^2:3^2$。`, R`面積比 $=4:9$。（$2:3$ 是邊長比，忘了平方；$16:81$ 是平方了兩次）`] },
      { q: R`已知 $\triangle ABC\sim\triangle DEF$，$\seg{AC}=5$，$\seg{DF}=7$。若 $\triangle ABC$ 的面積是 $50$，則 $\triangle DEF$ 的面積是多少？`,
        o: [R`$98$`, R`$70$`, R`$140$`, R`$\frac{250}{7}$`],
        h: [R`邊長比 $5:7$，面積比 $=5^2:7^2=25:49$。`, R`設 $\triangle DEF$ 面積為 $x$，則 $25:49=50:x$，所以 $25x=49\times 50$。`, R`$x=\frac{49\times 50}{25}=98$。`] },
      { q: R`如圖，同一時間，羅澤的身高 $\seg{AC}=1.7$ 公尺，影子 $\seg{BC}=1$ 公尺；旗桿的影子 $\seg{EF}=2$ 公尺。則旗桿高 $\seg{DF}$ 是多少公尺？`,
        o: [R`$3.4$`, R`$0.85$`, R`$3.7$`, R`$2.7$`],
        h: [R`同一時間陽光角度相同，$\triangle ABC\sim\triangle DEF$（AA 相似），所以<b>對應邊成比例</b>。`, R`身高：影長 ＝ 旗桿高：旗桿影長，$1.7:1=\seg{DF}:2$。`, R`$\seg{DF}=1.7\times 2=3.4$ 公尺。`],
        fig: { t: "geo", pts: { A: [1, 1.7], B: [0, 0], C: [1, 0], D: [4.2, 3.4], E: [2.2, 0], F: [4.2, 0] }, seg: ["AB", "BC", "CA", "DE", "EF", "FD"], ra: [["A", "C", "B"], ["D", "F", "E"]], sl: [["AC", "1.7", -1.2], ["BC", "1"], ["EF", "2"], ["DF", "?"]] } },
      { q: R`東蓁測得一棵樹的影長為 $350$ 公分，同一時間，一根長 $1$ 公尺的標桿影長為 $0.7$ 公尺。這棵樹高多少公尺？`,
        o: [R`$5$`, R`$500$`, R`$2.45$`, R`$245$`],
        h: [R`先<b>換成同單位</b>：$350$ 公分 $=3.5$ 公尺。`, R`樹高：樹影 ＝ 標桿：標桿影，$x:3.5=1:0.7$。`, R`$0.7x=3.5$，$x=5$ 公尺。（$500$ 是公分不是公尺）`] },
      { q: R`如圖，$\triangle ABC$ 中，$\angle A=\angle B=45^\circ$，$\angle C=90^\circ$。若 $\seg{AC}=4$，則 $\seg{AB}=$？`,
        o: [R`$4\sqrt{2}$`, R`$8$`, R`$2\sqrt{2}$`, R`$4\sqrt{3}$`],
        h: [R`$45^\circ-45^\circ-90^\circ$ 直角三角形的邊長比：<b>股：股：斜邊 $=1:1:\sqrt{2}$</b>。`, R`$\seg{AC}:\seg{AB}=1:\sqrt{2}$，所以 $\seg{AB}=4\times\sqrt{2}$。`, R`$\seg{AB}=4\sqrt{2}$。`],
        fig: { t: "geo", pts: { A: [0, 2], C: [0, 0], B: [2, 0] }, seg: ["AC", "CB", "BA"], ra: [["A", "C", "B"]], sl: [["AC", "4"]], txt: [[0.18, 1.45, "45°"], [1.45, 0.15, "45°"]] } },
      { q: R`等腰直角三角形的斜邊長為 $3\sqrt{2}$，則一股長為多少？`,
        o: [R`$3$`, R`$6$`, R`$\frac{3}{2}$`, R`$3\sqrt{2}$`],
        h: [R`股：股：斜邊 $=1:1:\sqrt{2}$。`, R`股長 $=$ 斜邊 $\div\sqrt{2}=3\sqrt{2}\div\sqrt{2}$。`, R`股長 $=3$。`] },
      { q: R`如圖，$\angle A=30^\circ$，$\angle B=60^\circ$，$\angle C=90^\circ$，則 $\seg{BC}:\seg{AC}:\seg{AB}=$？`,
        o: [R`$1:\sqrt{3}:2$`, R`$1:2:\sqrt{3}$`, R`$\sqrt{3}:1:2$`, R`$1:1:\sqrt{2}$`],
        h: [R`$30^\circ$ 角的對邊最短（$1$），斜邊是它的 $2$ 倍，$60^\circ$ 角的對邊是 $\sqrt{3}$。`, R`$\seg{BC}$ 對 $30^\circ$，$\seg{AC}$ 對 $60^\circ$，$\seg{AB}$ 是斜邊。`, R`$\seg{BC}:\seg{AC}:\seg{AB}=1:\sqrt{3}:2$。`],
        fig: { t: "geo", pts: { A: [0, 1.732], C: [0, 0], B: [1, 0] }, seg: ["AC", "CB", "BA"], ra: [["A", "C", "B"]], txt: [[0.13, 1.25, "30°"], [0.72, 0.15, "60°"]] } },
      { q: R`$30^\circ-60^\circ-90^\circ$ 的直角三角形 $ABC$ 中，$\angle A=30^\circ$，$\angle C=90^\circ$，斜邊 $\seg{AB}=10$，則 $\seg{BC}$、$\seg{AC}$ 分別為多少？`,
        o: [R`$\seg{BC}=5$，$\seg{AC}=5\sqrt{3}$`, R`$\seg{BC}=5\sqrt{3}$，$\seg{AC}=5$`, R`$\seg{BC}=5$，$\seg{AC}=5\sqrt{2}$`, R`$\seg{BC}=20$，$\seg{AC}=10\sqrt{3}$`],
        h: [R`$\seg{BC}:\seg{AC}:\seg{AB}=1:\sqrt{3}:2$（$\seg{BC}$ 是 $30^\circ$ 的對邊）。`, R`斜邊 $2$ 份 $=10$，所以 $1$ 份 $=5$。`, R`$\seg{BC}=5$，$\seg{AC}=5\sqrt{3}$。`] },
      { q: R`如圖，$\angle A=30^\circ$，$\angle C=90^\circ$，$\seg{AC}=6\sqrt{3}$，則斜邊 $\seg{AB}=$？`,
        o: [R`$12$`, R`$6$`, R`$12\sqrt{3}$`, R`$18$`],
        h: [R`$\seg{BC}:\seg{AC}:\seg{AB}=1:\sqrt{3}:2$。`, R`$\seg{AC}$ 是 $\sqrt{3}$ 份 $=6\sqrt{3}$，所以 $1$ 份 $=6$。`, R`$\seg{AB}=2\times 6=12$。`],
        fig: { t: "geo", pts: { A: [0, 0], C: [1.732, 0], B: [1.732, 1] }, seg: ["AC", "CB", "BA"], ra: [["A", "C", "B"]], sl: [["AC", "6√3"]], txt: [[0.42, 0.1, "30°"]] } },

function figSVG(f, forPrint) {
  if (!f) return "";
  if (f.t === "geo") return geoSVG(f, forPrint);
  const ink = forPrint ? "#111" : "#44403c", fill = forPrint ? "none" : "#fef3c7", lab = forPrint ? "#111" : "#b45309";
  const T = (x, y, s, anchor = "middle") => `<text x="${x}" y="${y}" font-size="15" font-weight="700" fill="${lab}" text-anchor="${anchor}" font-family="Times New Roman, serif" font-style="italic">${s}</text>`;
  if (f.t === "rt") {
    const k = 120 / Math.max(f.na, f.nb), w = f.nb * k, h = f.na * k, x0 = 30, y0 = 20;
    const B = [x0, y0 + h], C = [x0 + w, y0 + h], A = [x0 + w, y0];
    return `<svg viewBox="0 0 ${w + 70} ${h + 50}"><polygon points="${A} ${B} ${C}" fill="${fill}" stroke="${ink}" stroke-width="2"/>
      <polyline points="${C[0] - 12},${C[1]} ${C[0] - 12},${C[1] - 12} ${C[0]},${C[1] - 12}" fill="none" stroke="${ink}" stroke-width="1.5"/>
      ${T(A[0] + 10, y0 + h / 2 + 5, f.a, "start")}${T(x0 + w / 2, y0 + h + 22, f.b)}${T(x0 + w / 2 - 12, y0 + h / 2 - 4, f.c, "end")}</svg>`;
  }
  if (f.t === "rth") {
    const k = 120 / Math.max(f.na, f.nb), w = f.nb * k, h = f.na * k, x0 = 30, y0 = 20;
    const A = [x0, y0], B = [x0, y0 + h], C = [x0 + w, y0 + h];
    const ux = C[0] - A[0], uy = C[1] - A[1], t = ((B[0] - A[0]) * ux + (B[1] - A[1]) * uy) / (ux * ux + uy * uy);
    const D = [A[0] + t * ux, A[1] + t * uy];
    return `<svg viewBox="0 0 ${w + 60} ${h + 50}"><polygon points="${A} ${B} ${C}" fill="${fill}" stroke="${ink}" stroke-width="2"/>
      <polyline points="${B[0]},${B[1] - 12} ${B[0] + 12},${B[1] - 12} ${B[0] + 12},${B[1]}" fill="none" stroke="${ink}" stroke-width="1.5"/>
      <line x1="${B[0]}" y1="${B[1]}" x2="${D[0]}" y2="${D[1]}" stroke="${ink}" stroke-width="1.8" stroke-dasharray="5 4"/>
      ${T(x0 - 8, y0 + h / 2 + 5, f.a, "end")}${T(x0 + w / 2, y0 + h + 22, f.b)}${T((B[0] + D[0]) / 2 + 4, (B[1] + D[1]) / 2 + 16, "h", "start")}</svg>`;
  }
  if (f.t === "eq") {
    const s = 130, h = s * Math.sqrt(3) / 2, x0 = 25, y0 = 15, A = [x0 + s / 2, y0], B = [x0, y0 + h], C = [x0 + s, y0 + h];
    return `<svg viewBox="0 0 ${s + 50} ${h + 45}"><polygon points="${A} ${B} ${C}" fill="${fill}" stroke="${ink}" stroke-width="2"/>
      <line x1="${A[0]}" y1="${A[1]}" x2="${A[0]}" y2="${B[1]}" stroke="${ink}" stroke-width="1.6" stroke-dasharray="5 4"/>
      ${T(x0 + s / 4 - 10, y0 + h / 2 + 4, f.s, "end")}${T(x0 + 3 * s / 4 + 10, y0 + h / 2 + 4, f.s, "start")}${T(x0 + s / 2, y0 + h + 22, f.s)}${T(A[0] + 6, y0 + h * 0.7, "h", "start")}</svg>`;
  }
  if (f.t === "sq") {
    const s = 110, x0 = 30, y0 = 25;
    return `<svg viewBox="0 0 ${s + 60} ${s + 45}"><rect x="${x0}" y="${y0}" width="${s}" height="${s}" fill="${fill}" stroke="${ink}" stroke-width="2"/>
      <line x1="${x0}" y1="${y0 + s}" x2="${x0 + s}" y2="${y0}" stroke="${ink}" stroke-width="1.8"/>
      ${T(x0 + s / 2, y0 - 8, f.s)}${T(x0 - 8, y0 + s / 2 + 5, f.s, "end")}${T(x0 + s / 2 + 12, y0 + s / 2 + 14, f.d, "start")}</svg>`;
  }
  if (f.t === "rect") {
    const k = 150 / f.nw, w = f.nw * k, h = f.nh * k, x0 = 30, y0 = 25;
    return `<svg viewBox="0 0 ${w + 60} ${h + 45}"><rect x="${x0}" y="${y0}" width="${w}" height="${h}" fill="${fill}" stroke="${ink}" stroke-width="2"/>
      <line x1="${x0}" y1="${y0 + h}" x2="${x0 + w}" y2="${y0}" stroke="${ink}" stroke-width="1.8"/>
      ${T(x0 + w / 2, y0 - 8, f.w)}${T(x0 - 8, y0 + h / 2 + 5, f.h, "end")}${T(x0 + w / 2 + 10, y0 + h / 2 + 18, f.d, "start")}</svg>`;
  }
  return "";
}

// 通用幾何圖（數學座標，y 向上）：pts 點、seg 線段、circle/circle2 圓半徑、sector/segfill/arc 扇形/弓形/弧（角度）、
// line 直線、ra 直角記號 [邊點, 頂點, 邊點]、sl 邊長標示 [線段, 文字, 位移倍數]、txt [x, y, 文字]
function geoSVG(f, forPrint, W = 220) {
  const ink = forPrint ? "#111" : "#44403c", lab = forPrint ? "#111" : "#78350f", sideC = forPrint ? "#111" : "#1d4ed8", angC = forPrint ? "#111" : "#be123c";
  const secFill = forPrint ? "#e7e5e4" : "#fde68a", segFill = forPrint ? "#d6d3d1" : "#93c5fd";
  const P = f.pts || {}; let all = Object.values(P).slice();
  const R1 = Math.max(f.circle || 0, f.circle2 || 0);
  const arcPts = (a1, a2, r = 1, n = 40) => { const o = []; for (let i = 0; i <= n; i++) { const d = (a1 + (a2 - a1) * i / n) * Math.PI / 180; o.push([r * Math.cos(d), r * Math.sin(d)]); } return o; };
  if (R1) all.push([-R1, -R1], [R1, R1]);
  if (f.arc) all = all.concat(arcPts(f.arc[0], f.arc[1]));
  if (f.line) all = all.concat(f.line);
  let x0 = Math.min(...all.map(p => p[0])), x1 = Math.max(...all.map(p => p[0])), y0 = Math.min(...all.map(p => p[1])), y1 = Math.max(...all.map(p => p[1]));
  const span = Math.max(x1 - x0, y1 - y0) || 1, pad = Math.max(span * 0.17, (f.sl || []).some(x => x[2] > 1) ? span * 0.26 : 0);
  x0 -= pad; x1 += pad; y0 -= pad; y1 += pad;
  const sw = x1 - x0, sh = y1 - y0; let w = W, h = W * sh / sw; if (h > W * 1.15) { h = W * 1.15; w = h * sw / sh; }
  const u = sw / w, X = p => p[0].toFixed(4), Y = p => (-p[1]).toFixed(4), poly = pts => pts.map(p => X(p) + "," + Y(p)).join(" ");
  const ctr = R1 || f.arc ? [0, 0] : (() => { const v = Object.values(P); return [v.reduce((a, p) => a + p[0], 0) / v.length, v.reduce((a, p) => a + p[1], 0) / v.length]; })();
  const st = `stroke="${ink}" stroke-width="2" vector-effect="non-scaling-stroke" fill="none"`;
  let s = `<svg xmlns="http://www.w3.org/2000/svg" width="${w.toFixed(0)}" height="${h.toFixed(0)}" viewBox="${x0} ${-y1} ${sw} ${sh}">`;
  if (f.sector) s += `<polygon points="0,0 ${poly(arcPts(f.sector[0], f.sector[1]))}" fill="${secFill}" stroke="none"/>`;
  if (f.segfill) s += `<polygon points="${poly(arcPts(f.segfill[0], f.segfill[1]))}" fill="${segFill}" stroke="none"/>`;
  if (f.circle) s += `<circle cx="0" cy="0" r="${f.circle}" ${st}/>`;
  if (f.circle2) s += `<circle cx="0" cy="0" r="${f.circle2}" ${st}/>`;
  if (f.arc) s += `<polyline points="${poly(arcPts(f.arc[0], f.arc[1]))}" ${st}/>`;
  if (f.line) s += `<line x1="${X(f.line[0])}" y1="${Y(f.line[0])}" x2="${X(f.line[1])}" y2="${Y(f.line[1])}" ${st}/>`;
  (f.seg || []).forEach(g => { const a = P[g[0]], b = P[g[1]]; if (a && b) s += `<line x1="${X(a)}" y1="${Y(a)}" x2="${X(b)}" y2="${Y(b)}" ${st}/>`; });
  (f.ra || []).forEach(([pa, pv, pb]) => {
    const V = P[pv], A = P[pa], B = P[pb]; if (!V || !A || !B) return;
    const n = q => { const dx = q[0] - V[0], dy = q[1] - V[1], l = Math.hypot(dx, dy) || 1; return [dx / l, dy / l]; };
    const e1 = n(A), e2 = n(B), k = 9 * u;
    s += `<polyline points="${poly([[V[0] + e1[0] * k, V[1] + e1[1] * k], [V[0] + (e1[0] + e2[0]) * k, V[1] + (e1[1] + e2[1]) * k], [V[0] + e2[0] * k, V[1] + e2[1] * k]])}" stroke="${ink}" stroke-width="1.3" vector-effect="non-scaling-stroke" fill="none"/>`;
  });
  const fs = 15 * u, txt = (x, y, t, c, sz, it) => `<text x="${x.toFixed(4)}" y="${(-y + sz * 0.35).toFixed(4)}" font-size="${sz.toFixed(4)}" text-anchor="middle" fill="${c}" font-weight="700" font-family="Times New Roman, serif"${it ? ' font-style="italic"' : ""}>${t}</text>`;
  Object.entries(P).forEach(([nm, p]) => {
    s += `<circle cx="${X(p)}" cy="${Y(p)}" r="${2.2 * u}" fill="${ink}"/>`;
    let dx = p[0] - ctr[0], dy = p[1] - ctr[1], l = Math.hypot(dx, dy); if (l < 1e-6) { dx = -0.7; dy = -0.7; l = 1; }
    s += txt(p[0] + dx / l * 11 * u, p[1] + dy / l * 11 * u, nm, lab, fs, true);
  });
  (f.sl || []).forEach(([g, t, km]) => {
    const a = P[g[0]], b = P[g[1]]; if (!a || !b) return;
    const m = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2]; let nx = -(b[1] - a[1]), ny = b[0] - a[0]; const l = Math.hypot(nx, ny) || 1; nx /= l; ny /= l;

  updateQuestionUI(qIdx);

}
function checkModuleCompletion(modIdx) {

async function fetchAllStudentRecords() {
  if (!db) return null;
  const snap = await fs.getDocs(fs.collection(db, "artifacts", appId, "public", "data", COLLECTION_NAME));
  const groups = {};
  snap.forEach(d => { const r = d.data(); if (!r || r.mergedInto) return; const k = canonKey(r.studentSeat, r.studentName); (groups[k] = groups[k] || []).push(r); });
  // 同一位學生如果有不同寫法的紀錄（學生尚未重新登入），先在後台合併顯示
  const out = Object.values(groups).map(rs => rs.length === 1 ? { ...rs[0], studentSeat: normSeat(rs[0].studentSeat), studentName: normName(rs[0].studentName) } : mergeRecords(rs));
  return out.sort((a, b) => (parseInt(a.studentSeat) || 0) - (parseInt(b.studentSeat) || 0));
}
function mergeRecords(rs) {
  const out = { studentId: rs[0].studentId, studentSeat: normSeat(rs[0].studentSeat), studentName: normName(rs[0].studentName), scores: {}, mistakes: [], slain: {}, mistakeLog: {}, history: [], lastUpdated: 0 };
  rs.forEach(r => {
    Object.entries(r.scores || {}).forEach(([k, v]) => { const l = out.scores[k]; out.scores[k] = l ? { first: Math.min(l.first, v.first), best: Math.max(l.best, v.best), n: (l.n || 1) + (v.n || 1) } : v; });
    Object.assign(out.slain, r.slain || {});
    (r.mistakes || []).forEach(m => { if (!out.mistakes.some(x => x.q === m.q)) out.mistakes.push(m); });
    Object.entries(r.mistakeLog || {}).forEach(([q, v]) => { if (!out.mistakeLog[q] || (v.count || 0) > out.mistakeLog[q].count) out.mistakeLog[q] = v; });
    out.history.push(...(r.history || [])); out.lastUpdated = Math.max(out.lastUpdated, r.lastUpdated || 0);
  });
  out.history.sort((a, b) => a.timestamp - b.timestamp); out.mistakesCount = out.mistakes.length;
  return out;
}
// 學生作答統計（只算改版後有細項的紀錄）
function recStats(r, modFilter) {
  // 沒指定單元時只統計單元測驗（不含錯題重練）
  const hs = (r.history || []).filter(h => modFilter === undefined ? typeof h.moduleId === "number" : String(h.moduleId) === String(modFilter));
  const v2 = hs.filter(h => h.v === 2), sum = k => v2.reduce((a, h) => a + (h[k] || 0), 0);
  return { tries: hs.length, v2: v2.length, old: hs.length - v2.length, q: v2.reduce((a, h) => a + h.maxScore, 0), indep: sum("solo") + sum("hinted"), solo: sum("solo"), hinted: sum("hinted"), full: sum("full"), wrongNo: sum("wrongNo"), wrongHint: sum("wrongHint") };
}

const VERSION_INFO = {
  A: { name: "A 版", guide: "請在作答區寫出完整的計算過程，最後把答案寫在「答：」後面。", work: 38 },

};
function buildWorksheet() {
  const units = [...document.querySelectorAll(".ps-unit:checked")].map(e => +e.value);

  closePrintSetup();
  renderSheets(groups, ver, document.getElementById("ps-opts").checked, document.getElementById("ps-key").checked, units.map(i => appData.modules[i].title.split(" ")[0]).join("、"));

// groups: [{ title, subtitle, items: [{ q, unit, wrongN?, unitTag? }] }]
function renderSheets(groups, ver, withOpts, withKey, summary) {
  const vi = VERSION_INFO[ver];
  const nh = ver === "A" ? 0 : ver === "B" ? 1 : 2;
  const stepNames = ["第一步", "第二步"];
  const letters = ["(A)", "(B)", "(C)", "(D)"];
  const hasWrong = groups.some(g => g.items.some(it => it.wrongN !== undefined));
  let html = "", keyRows = [];
  groups.forEach(g => {
    const body = g.items.map((it, n) => {
      const q = it.q;
      const ordered = withOpts ? seededShuffle(q.options, q.q) : null; // 選項順序以題目為種子，每次列印都一樣
      keyRows.push({ unit: it.unit, n: n + 1, ans: ordered ? `${letters[ordered.indexOf(q.correctStr)]} ${q.correctStr}` : q.correctStr, how: q.hints[2], wrongN: it.wrongN });
      return `<div class="pq ${q.fig ? "pq-g" : ""}"><div class="pq-main">
        <div class="pq-head"><span class="pq-no">${n + 1}.</span><div>${it.unitTag ? `<span class="pq-adv" style="margin:0 6px 0 0">${it.unitTag}</span>` : ""}${q.q}${q.lv === 2 ? `<span class="pq-adv">★進階</span>` : ""}</div></div>
        ${ordered ? `<div class="pq-opts">${ordered.map((o, k) => `<span>${letters[k]} ${o}</span>`).join("")}</div>` : ""}
        ${q.hints.slice(0, nh).map((h, k) => `<div class="pq-hint"><b>${stepNames[k]}</b>${h}</div>`).join("")}
        <div class="pq-work" style="height:${q.fig && vi.work < 30 ? 30 : vi.work}mm">${ver === "C" ? `<span style="font-size:10pt;color:#555">最後一步：</span>` : ""}<div class="ans">答：<span>&nbsp;</span></div></div>
      </div>${q.fig ? `<div class="pq-fig">${figSVG(q.fig, true)}</div>` : ""}</div>`;
    }).join("");
    html += `<section class="sheet">
      <div class="sheet-head">
        <div><div class="sheet-title">${g.title}<span class="ver-tag">${vi.name}</span></div>
        <div class="sheet-sub">${g.subtitle}</div></div>
        <div class="sheet-fields">班級 <span></span> 座號 <span style="min-width:10mm"></span> 姓名 <span style="min-width:26mm"></span></div>
      </div>
      <div class="sheet-guide">📝 ${vi.guide}${withOpts ? "（請把選項代號寫在「答：」後面）" : ""}</div>
      ${body}
    </section>`;
  });
  if (withKey) {
    html += `<section class="sheet"><div class="sheet-head"><div><div class="sheet-title">解答（教師用）<span class="ver-tag">${vi.name}</span></div><div class="sheet-sub">關鍵步驟即網站上的第 3 個提示${hasWrong ? "；「答錯人數」為曾答錯（或用完提示）的學生數" : ""}</div></div></div>
      <table class="key-table"><thead><tr><th style="width:16%">單元</th><th style="width:6%">題</th>${hasWrong ? `<th style="width:9%">答錯人數</th>` : ""}<th style="width:28%">答案</th><th>關鍵步驟</th></tr></thead><tbody>
      ${keyRows.map(r => `<tr><td>${r.unit}</td><td>${r.n}</td>${hasWrong ? `<td>${r.wrongN ?? ""} 人</td>` : ""}<td>${r.ans}</td><td>${r.how}</td></tr>`).join("")}</tbody></table></section>`;
  }
  const root = document.getElementById("print-root");
  root.innerHTML = html;
  document.getElementById("print-summary").textContent = `學習單預覽｜${vi.name}｜${summary}`;
  document.getElementById("print-overlay").classList.remove("hidden");
  document.getElementById("print-overlay").scrollTop = 0;
  document.body.style.overflow = "hidden";
  triggerKatex(root);
}

function seededShuffle(arr, seedStr) {
  let h = 2166136261; for (const c of seedStr) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); }
  const rnd = () => { h = Math.imul(h ^ (h >>> 15), 2246822507); h = Math.imul(h ^ (h >>> 13), 3266489909); h ^= h >>> 16; return (h >>> 0) / 4294967296; };
  const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a;
}
