<style>

<script>
// ===== 題庫：九年級會考複習（第一～六冊）=====
// 出題依據：老師提供的「幫你達 B 講義（第一～六冊）」「115 會考幫你達 B 300 題」「102-113 歷屆會考幫你達 B」「會考幫你達 B 終極版 12 個必考重點」與考前暖身操。
// 每單元題數依「111-115 會考前 10 題單元出現率」配置：出現越多的單元題目越多（10～18 題）。全部是基礎概念題，★進階 為會考原題或稍有變化的題型。
// 格式：q 題目、o 選項（第一個是正確答案，網站會自動打亂）、h 三層提示（第一步、第二步、最後一步）、s 觀念、fig 圖形（可省略）、lv: 2 為 ★進階
const R = String.raw;
const RAW_MODULES = [];
// ===== 第一冊 =====
RAW_MODULES.push(
{
  code: "01", book: 1, title: "簡單計算", chap: "第一冊 第 1、2 章", freq: 5,
  subtitle: "整數與分數的四則運算、先乘除後加減、正負號判斷",
  tips: {
    "四則運算順序": "先括號 → 再乘除 → 最後加減；絕對值也要先算出來（練功房 1）。",
    "正負號判斷": "連乘除時先數負號：偶數個負號為正、奇數個為負（練功房 1 第 1 題）。",
    "分數的加減": "負號放分子、通分、分子相加減，分母不相加（練功房 2）。",
    "分數的乘除": "帶分數先化假分數；除以一個數＝乘以它的倒數（練功房 2）。",
    "分數比大小": "全部化成小數或通分後再比；負數比大小要反過來（練功房 2 第 1 題）。",
    "分配律簡算": "看到相近的數字，用分配律湊整再算（練功房 1 第 4 題）。"
  },
  practice: [
    { q: R`算式 $(-2)\times|-5|-|-3|$ 之值為何？`, s: "四則運算順序",
      o: [R`$-13$`, R`$7$`, R`$13$`, R`$-7$`],
      h: [R`先把絕對值算出來：$|-5|=5$、$|-3|=3$。`, R`$(-2)\times5-3=-10-3$。`, R`答案是 $-13$。（106 會考第 1 題）`] },
    { q: R`計算 $12\div(-3)-2\times(-3)$ 之值為何？`, s: "四則運算順序",
      o: [R`$2$`, R`$-10$`, R`$18$`, R`$-18$`],
      h: [R`先乘除後加減，兩段分開算。`, R`$12\div(-3)=-4$；$2\times(-3)=-6$，所以 $-4-(-6)=-4+6$。`, R`答案是 $2$。（102 基測第 1 題）`] },
    { q: R`算式 $|3-2\times2|-(2-5)$ 之值為何？`, s: "四則運算順序",
      o: [R`$4$`, R`$5$`, R`$-5$`, R`$-6$`],
      h: [R`絕對值裡面也要先乘除後加減：$3-2\times2=3-4$。`, R`$|-1|-(-3)=1+3$。`, R`答案是 $4$。`] },
    { q: R`計算 $(-12)+(-18)\div(-6)-(-3)\times2$ 之值為何？`, s: "四則運算順序",
      o: [R`$-3$`, R`$-15$`, R`$11$`, R`$16$`],
      h: [R`先算除法和乘法：$(-18)\div(-6)$、$(-3)\times2$。`, R`$(-18)\div(-6)=3$，$(-3)\times2=-6$，所以 $-12+3-(-6)=-12+3+6$。`, R`答案是 $-3$。（95 基測第 1 題）`] },
    { q: R`計算 $9+(-2)\times[18-(-3)\times2]\div4$ 之值為何？`, s: "四則運算順序",
      o: [R`$-3$`, R`$3$`, R`$21$`, R`$42$`],

function mergeCloudIntoLocal(c) {

    const l = scores[k], r = c.scores[k];
    if (k[0] === "x") { if (!l || (r.rounds || 0) > (l.rounds || 0)) scores[k] = r; continue; }
    if (k === "rw") { const L0 = l || { seen: [], skin: "classic", pet: null }; scores.rw = { seen: [...new Set([...(L0.seen || []), ...(r.seen || [])])], skin: L0.skin && L0.skin !== "classic" ? L0.skin : (r.skin || "classic"), pet: L0.pet || r.pet || null }; continue; }
    if (!l) scores[k] = r;
    else if ((l.v === 2) !== (r.v === 2)) { const nw = l.v === 2 ? l : r; scores[k] = { ...nw, n: Math.max(l.n || 1, r.n || 1) }; }
    else scores[k] = { ...l, first: l.first ?? r.first, best: Math.max(l.best || 0, r.best || 0), n: Math.max(l.n || 0, r.n || 0) };
  }
  if (c.slain) for (const q in c.slain) slain[q] = Math.max(slain[q] || 0, c.slain[q]);
  if (Array.isArray(c.mistakes)) c.mistakes.forEach(raw => {

    const r = normMistake(raw), i = mistakes.findIndex(x => x.q === r.q);
    if (i === -1) mistakes.push(r); else if (r.upd > mistakes[i].upd) mistakes[i] = r;
  });
  // 已消滅（而且之後沒有再錯）的題目，不要被舊資料加回來
  mistakes = mistakes.filter(m => !(slain[m.q] && slain[m.q] >= m.upd));
  if (c.mistakeLog) for (const k in c.mistakeLog) { if (!mistakeLog[k] || (c.mistakeLog[k].count || 0) > (mistakeLog[k].count || 0)) mistakeLog[k] = c.mistakeLog[k]; }
  if (Array.isArray(c.history)) { const seen = new Set(studentHistory.map(h => h.timestamp)); c.history.forEach(h => { if (!seen.has(h.timestamp)) studentHistory.push(h); }); studentHistory.sort((a, b) => a.timestamp - b.timestamp); }

}

async function doSyncDataToCloud() {

    const ref = studentDocRef(idAtStart);
    const snap = await fs.getDoc(ref);
    if (idAtStart !== getStudentId()) return;
    const sig = () => JSON.stringify([scores, mistakes, studentHistory.length, Object.keys(slain).length]);
    const before = sig();
    const histBefore = studentHistory.length;
    if (snap.exists()) mergeCloudIntoLocal(snap.data());
    // 第一次同步：把雲端上「同一位學生、但代號寫法不同」的舊紀錄一起找回來（例如 07_王小明、7_王 小明）
    let foundOld = 0;
    if (!legacyChecked[idAtStart]) {
      legacyChecked[idAtStart] = true;
      try {
        const all = await fs.getDocs(fs.collection(db, "artifacts", appId, "public", "data", COLLECTION_NAME));
        const olds = []; all.forEach(d => { const r = d.data(); if (r && r.studentId !== idAtStart && !r.mergedInto && canonKey(r.studentSeat, r.studentName) === idAtStart) olds.push(r); });
        for (const r of olds) { mergeCloudIntoLocal(r); foundOld++; await fs.setDoc(studentDocRef(r.studentId), { ...r, mergedInto: idAtStart }); }
      } catch (e) { console.warn("舊紀錄搜尋失敗：", e); }
      reportCloudLoad(snap.exists() || foundOld > 0, studentHistory.length - histBefore);
    }
    const changed = before !== sig();

    if (changed) { renderNav(); if (!isQuizActive) refreshCurrentView(); }

}

function saveScore(i, s) {
  const cur = scores[i];
  if (!cur) scores[i] = { first: s, best: s, n: 1, v: 2 };
  else if (cur.v !== 2) scores[i] = { first: cur.first, best: s, n: (cur.n || 1) + 1, v: 2, oldBest: cur.best };   // 改版前的最佳（含看完提示）不再沿用
  else scores[i] = { first: cur.first, best: Math.max(cur.best, s), n: (cur.n || 1) + 1, v: 2 };

// 答錯或看完提示才答對 → 放進（或退回）第一關
function addToMistakes(qData) {
  const ex = mistakes.find(m => m.q === qData.q), realMod = ex ? ex.modIdx : qData.modIdx, t = nowTs();
  if (ex) { ex.stage = 1; ex.due = 0; ex.upd = t; }
  else mistakes.push({ modIdx: realMod, q: qData.q, stage: 1, due: 0, upd: t });
  const k = qData.q; mistakeLog[k] = { modIdx: realMod, count: ((mistakeLog[k] || {}).count || 0) + 1, last: Date.now() };

}
const STAGE_INFO = {
  1: { name: "第一關：馬上重做", short: "第一關", icon: "👾", wait: 0, color: "rose" },
  2: { name: "第二關：兩天後再戰", short: "第二關", icon: "👹", wait: 2 * 864e5, color: "amber" },

function promoteMistake(qText) {
  const m = mistakes.find(x => x.q === qText); if (!m) return null;
  const t = nowTs();
  if (m.stage >= 3) { mistakes = mistakes.filter(x => x.q !== qText); slain[qText] = t; saveLocalAll(); return "slain"; }
  m.stage += 1; m.due = t + STAGE_INFO[m.stage].wait; m.upd = t; saveLocalAll(); return m.stage;
}

function computeWeakSkills() {
  const tally = {};
  mistakes.forEach(m => {
    const info = SKILL_OF[m.q]; if (!info) return;
    const k = info.skill; tally[k] = tally[k] || { skill: k, modIdx: info.modIdx, now: 0, total: 0 };
    tally[k].now++;
  });
  Object.entries(mistakeLog).forEach(([q, v]) => {
    const info = SKILL_OF[q]; if (!info || !tally[info.skill]) return;
    tally[info.skill].total += v.count || 1;
  });
  return Object.values(tally).sort((a, b) => b.now - a.now || b.total - a.total);
}
// items: [{ label, first, best, has }]（first/best 為 0~100）
function progressChartSVG(items) {
  const W = 620, H = 330, L = 46, Rr = 12, T = 18, B = 286;
  const pw = W - L - Rr, gw = pw / items.length, bw = Math.min(30, gw * 0.3);
  const y = v => B - (B - T) * v / 100;
  let g = `<rect x="${L}" y="${y(80)}" width="${pw}" height="${y(65) - y(80)}" fill="#fef3c7" opacity=".7"/><text x="${W - Rr - 4}" y="${y(65) - 5}" font-size="12" font-weight="700" fill="#b45309" text-anchor="end">B 目標線 65%</text>`;
  for (let v = 0; v <= 100; v += 20) g += `<line x1="${L}" x2="${W - Rr}" y1="${y(v)}" y2="${y(v)}" stroke="#e7e5e4" stroke-width="1"/><text x="${L - 8}" y="${y(v) + 4}" font-size="14" fill="#78716c" text-anchor="end">${v}</text>`;
  g += `<line x1="${L}" x2="${W - Rr}" y1="${y(65)}" y2="${y(65)}" stroke="#f59e0b" stroke-width="1.6" stroke-dasharray="6 4"/>`;
  items.forEach((it, i) => {
    const cx = L + gw * i + gw / 2;
    const bar = (x, v, c) => `<rect x="${x}" y="${y(v)}" width="${bw}" height="${B - y(v)}" rx="5" fill="${c}"/>${it.has ? `<text x="${x + bw / 2}" y="${y(v) - 6}" font-size="12" font-weight="700" fill="#57534e" text-anchor="middle">${v}</text>` : ""}`;
    g += bar(cx - bw - 2, it.first, "#d6d3d1") + bar(cx + 2, it.best, "#10b981");
    g += `<text x="${cx}" y="${B + 22}" font-size="${items.length > 6 ? 13 : 15}" font-weight="700" fill="#57534e" text-anchor="middle">${it.label}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" class="w-full h-auto" role="img" aria-label="首次與最佳答對率">${g}
    <line x1="${L}" x2="${W - Rr}" y1="${B}" y2="${B}" stroke="#a8a29e" stroke-width="1.2"/></svg>
    <div class="flex flex-wrap justify-center gap-6 text-sm font-bold text-stone-600 mt-1">
      <span class="flex items-center gap-2"><span class="w-10 h-3 rounded bg-stone-300"></span>首次挑戰</span>
      <span class="flex items-center gap-2"><span class="w-10 h-3 rounded bg-emerald-500"></span>最佳表現</span></div>`;
}
function unitChartItems(idxs) { return idxs.map(i => { const s = scores[i], max = MODS[i].practice.length; return { label: MODS[i].code, first: s ? Math.round(s.first / max * 100) : 0, best: s ? Math.round(s.best / max * 100) : 0, has: !!s }; }); }
function bookChartItems() {

function buildMockSet() {
  const pool = MODS.map(m => m.practice.slice());
  const chosen = [];
  for (let n = 0; n < MOCK_N; n++) {
    const cand = MODS.map((m, i) => i).filter(i => pool[i].length);
    const tw = cand.reduce((a, i) => a + unitWeight(MODS[i]), 0);
    let r = Math.random() * tw, pick = cand[0];
    for (const i of cand) { r -= unitWeight(MODS[i]); if (r <= 0) { pick = i; break; } }
    const k = Math.floor(Math.random() * pool[pick].length);
    chosen.push(pool[pick].splice(k, 1)[0]);
  }
  return chosen.sort((a, b) => (a.lv - b.lv) || (MODS[a.modIdx].book - MODS[b.modIdx].book));
}

function figSVG(f, forPrint) {
  if (!f) return "";
  if (f.t === "geo") return geoSVG(f, forPrint);
  const ink = forPrint ? "#111" : "#44403c", fill = forPrint ? "none" : "#fef3c7", lab = forPrint ? "#111" : "#b45309", soft = forPrint ? "#999" : "#d6d3d1";
  const T = (x, y, s, anchor = "middle") => `<text x="${x}" y="${y}" font-size="15" font-weight="700" fill="${lab}" text-anchor="${anchor}" font-family="Times New Roman, serif" font-style="italic">${s}</text>`;
  const N = (x, y, s, anchor = "middle", sz = 12, c = ink) => `<text x="${x}" y="${y}" font-size="${sz}" fill="${c}" text-anchor="${anchor}" font-family="Noto Sans TC, sans-serif">${s}</text>`;
  if (f.t === "rt") {
    const k = 120 / Math.max(f.na, f.nb), w = f.nb * k, h = f.na * k, x0 = 30, y0 = 20;
    const B = [x0, y0 + h], C = [x0 + w, y0 + h], A = [x0 + w, y0];
    return `<svg viewBox="0 0 ${w + 70} ${h + 50}"><polygon points="${A} ${B} ${C}" fill="${fill}" stroke="${ink}" stroke-width="2"/>
      <polyline points="${C[0] - 12},${C[1]} ${C[0] - 12},${C[1] - 12} ${C[0]},${C[1] - 12}" fill="none" stroke="${ink}" stroke-width="1.5"/>
      ${T(A[0] + 10, y0 + h / 2 + 5, f.a, "start")}${T(x0 + w / 2, y0 + h + 22, f.b)}${T(x0 + w / 2 - 12, y0 + h / 2 - 4, f.c, "end")}</svg>`;
  }
  if (f.t === "rth") {
    const k = 120 / Math.max(f.na, f.nb), w = f.nb * k, h = f.na * k, x0 = 30, y0 = 20;
    const A = [x0, y0], B = [x0, y0 + h], C = [x0 + w, y0 + h];
    const ux = C[0] - A[0], uy = C[1] - A[1], t = ((B[0] - A[0]) * ux + (B[1] - A[1]) * uy) / (ux * ux + uy * uy);
    const D = [A[0] + t * ux, A[1] + t * uy];
    return `<svg viewBox="0 0 ${w + 60} ${h + 50}"><polygon points="${A} ${B} ${C}" fill="${fill}" stroke="${ink}" stroke-width="2"/>
      <polyline points="${B[0]},${B[1] - 12} ${B[0] + 12},${B[1] - 12} ${B[0] + 12},${B[1]}" fill="none" stroke="${ink}" stroke-width="1.5"/>
      <line x1="${B[0]}" y1="${B[1]}" x2="${D[0]}" y2="${D[1]}" stroke="${ink}" stroke-width="1.8" stroke-dasharray="5 4"/>
      ${T(x0 - 8, y0 + h / 2 + 5, f.a, "end")}${T(x0 + w / 2, y0 + h + 22, f.b)}${T((B[0] + D[0]) / 2 + 4, (B[1] + D[1]) / 2 + 16, "h", "start")}</svg>`;
  }
  if (f.t === "sq") {
    const s = 110, x0 = 30, y0 = 25;
    return `<svg viewBox="0 0 ${s + 60} ${s + 45}"><rect x="${x0}" y="${y0}" width="${s}" height="${s}" fill="${fill}" stroke="${ink}" stroke-width="2"/>
      <line x1="${x0}" y1="${y0 + s}" x2="${x0 + s}" y2="${y0}" stroke="${ink}" stroke-width="1.8"/>
      ${T(x0 + s / 2, y0 - 8, f.s)}${T(x0 - 8, y0 + s / 2 + 5, f.s, "end")}${T(x0 + s / 2 + 12, y0 + s / 2 + 14, f.d, "start")}</svg>`;
  }
  if (f.t === "nl") { // 數線：min~max 等分 div 格
    const W = 300, x0 = 22, x1 = W - 22, yb = 46, span = f.max - f.min;
    const X = v => x0 + (v - f.min) / span * (x1 - x0);
    let s = `<line x1="${x0 - 14}" y1="${yb}" x2="${x1 + 14}" y2="${yb}" stroke="${ink}" stroke-width="2"/><polygon points="${x1 + 18},${yb} ${x1 + 8},${yb - 5} ${x1 + 8},${yb + 5}" fill="${ink}"/>`;
    for (let k = 0; k <= f.div; k++) { const v = f.min + span * k / f.div, big = Math.abs(v - Math.round(v)) < 1e-9; s += `<line x1="${X(v)}" y1="${yb - (big ? 8 : 5)}" x2="${X(v)}" y2="${yb + (big ? 8 : 5)}" stroke="${ink}" stroke-width="${big ? 2 : 1.3}"/>`; if (big && !f.nonum && !(f.labels || []).some(l => l[0] === v)) s += N(X(v), yb + 24, String(v), "middle", 13); }
    (f.labels || []).forEach(([v, t]) => { s += N(X(v), yb + 24, t, "middle", 13); });
    (f.pts || []).forEach(([n, v]) => { s += `<circle cx="${X(v)}" cy="${yb}" r="4.5" fill="${forPrint ? "#111" : "#dc2626"}"/>${T(X(v), yb - 14, n)}`; });
    return `<svg viewBox="0 0 ${W} 80">${s}</svg>`;
  }

function showHint(qIdx) {
  const st = qState[qIdx]; if (st.answered || st.hintsShown >= 3) return;
  st.hintsShown++; if (st.hintsShown === 3) st.isMistake = true;
  updateQuestionUI(qIdx);
}
function updateQuestionUI(qIdx) {

  const box = document.getElementById(`hints-${qIdx}`);

// 每題結果分成：solo 沒看提示答對／hinted 看 1～2 步答對（以上兩種＝獨立答對，計分）
//              full 看完 3 步才答對（不計分）／wrongNo 沒看提示答錯／wrongHint 有看提示答錯
function selectHintOption(qIdx, oIdx) {
  const st = qState[qIdx]; if (st.answered) return;
  const view = currentView, isReview = /^review/.test(String(view));
  const qd = currentModuleData[qIdx], isCorrect = qd.shuffled[oIdx] === qd.correctStr, used = st.hintsShown;
  st.answered = true; st.selectedOption = oIdx; st.correct = isCorrect; st.hintsUsed = used;
  st.cat = isCorrect ? (used === 0 ? "solo" : used < 3 ? "hinted" : "full") : (used === 0 ? "wrongNo" : "wrongHint");
  const indep = st.cat === "solo" || st.cat === "hinted";
  const fb = document.getElementById(`feedback-${qIdx}`);
  fb.classList.remove("hidden");
  document.getElementById(`btn-${qIdx}-${oIdx}`).classList.add(isCorrect ? "btn-correct" : "btn-wrong");
  const into = qd.gen ? "（加練題不列入錯題）" : isReview ? "怪物逃回第一關，再練一次吧！" : "已放進錯題重練第一關。";
  if (indep) {
    currentModuleCorrectCount++;
    let extra = "";

    fb.innerHTML = `✅ 答對了！${used ? `（看了 ${used} 步提示，仍算獨立答對）` : ""}<span class="text-xs block mt-1 opacity-80">${extra || "上方已列出完整的三步驟解法，對照看看你的想法是不是一樣。"}</span>`;
    fb.className = "mt-6 text-base font-bold text-center py-4 rounded-2xl bg-green-100 text-green-800 fade-in";
  } else {
    if (!qd.gen) addToMistakes(qd);
    if (isCorrect) {
      fb.innerHTML = `✅ 答案正確，但因為看完 3 步提示，<b>不計入得分</b>。<span class="text-xs block mt-1 opacity-80">${into}</span>`;
      fb.className = "mt-6 text-base font-bold text-center py-4 rounded-2xl bg-amber-100 text-amber-800 fade-in";
    } else {
      const ci = qd.shuffled.indexOf(qd.correctStr);
      document.getElementById(`btn-${qIdx}-${ci}`).classList.add("btn-correct");
      fb.innerHTML = `❌ 再想想！正確答案已標示為綠色，上面有完整解題步驟。<span class="text-xs block mt-1 opacity-80">${into}</span>`;
      fb.className = "mt-6 text-base font-bold text-center py-4 rounded-2xl bg-rose-100 text-rose-800 fade-in";
    }
  }
  st.hintsShown = 3; // 作答後顯示完整解題步驟（不影響計分）
  document.querySelectorAll(`.opt-btn-${qIdx}`).forEach(b => { b.disabled = true; b.classList.remove("hover:border-amber-400", "hover:bg-amber-50"); });
  updateQuestionUI(qIdx);
  document.getElementById("score-badge").textContent = `獨立答對: ${currentModuleCorrectCount}/${currentModuleData.length}`;

}
function checkModuleCompletion(modIdx) {
  if (!qState.every(s => s.answered)) return;
  isQuizActive = false;
  const max = currentModuleData.length, cnt = k => qState.filter(s => s.cat === k).length;
  const rec = { solo: cnt("solo"), hinted: cnt("hinted"), full: cnt("full"), wrongNo: cnt("wrongNo"), wrongHint: cnt("wrongHint") };
  const genC = /^gen(\d+)$/.exec(String(modIdx)), isReview = /^review/.test(String(modIdx));
  if (genC) { const k = "x" + genC[1], o = scores[k] || { rounds: 0, correct: 0, total: 0 }; scores[k] = { rounds: o.rounds + 1, correct: o.correct + currentModuleCorrectCount, total: o.total + max }; saveLocalAll(); }
  else if (!isReview) saveScore(modIdx, currentModuleCorrectCount);
  const elapsed = document.getElementById("mock-timer") ? document.getElementById("mock-timer").textContent.replace("⏱ ", "") : "";
  stopMockTimer();
  const title = isReview ? `錯題重練・${STAGE_INFO[+String(modIdx).slice(-1)].short}` : modIdx === "mock" ? "會考比例模擬" : genC ? "🎲 加練 " + unitLabel(+genC[1]) : unitLabel(modIdx);
  studentHistory.push({ moduleId: modIdx, moduleTitle: title, score: currentModuleCorrectCount, maxScore: max, timestamp: Date.now(), v: 2, ...rec });
  saveLocalAll(); syncDataToCloud();
  const p = currentModuleCorrectCount / max, lv = levelOf(p);
  document.getElementById("final-msg").innerHTML = `完成！獨立答對 ${currentModuleCorrectCount}/${max} ${p === 1 ? "🏆 全對！" : p >= .8 ? "👍 很棒！" : "💪 再接再厲！"}`;
  document.getElementById("final-sub").innerHTML = isReview ? `👾 目前錯題：第一關 ${mistakes.filter(m => m.stage === 1).length}・第二關 ${mistakes.filter(m => m.stage === 2).length}・第三關 ${mistakes.filter(m => m.stage === 3).length}・已消滅 ${Object.keys(slain).length} 隻` : genC ? `本回獨立答對 ${currentModuleCorrectCount}/${max}，再抽一回，數字又會不一樣！<br><span class="text-xs">加練累積：${scores["x" + genC[1]].rounds} 回、答對 ${scores["x" + genC[1]].correct}/${scores["x" + genC[1]].total} 題</span>` :
    `本回基礎題推估等級：<span class="lv lv-${lv.g} text-lg">${lv.name}</span>${elapsed ? `　用時 ${elapsed}` : ""}<br><span class="text-xs">${lv.g === "C" ? `再獨立答對 ${Math.ceil(0.65 * max - 1e-9) - currentModuleCorrectCount} 題就到 B！先看錯題的三步驟提示。` : lv.g === "B" ? `已達 B！把錯題重練一次，往 ${lv.name === "B++" ? "A" : "B++"} 前進。` : "基礎題已經很穩，可以多練 ★進階題。"}</span>`;
  document.getElementById("final-detail").innerHTML = `沒看提示答對 <b>${rec.solo}</b>・看 1～2 步提示答對 <b>${rec.hinted}</b>・看完提示才答對 <b>${rec.full}</b>（不計分）<br>答錯：沒看提示 <b>${rec.wrongNo}</b>・有看提示 <b>${rec.wrongHint}</b>`;
  const fr = document.getElementById("footer-review"); if (fr && mistakes.length) fr.classList.remove("hidden");

}

// groups: [{ title, subtitle, items: [{ q, unit, wrongN?, unitTag? }] }]
function renderSheets(groups, ver, withOpts, withKey, summary) {
  const vi = VERSION_INFO[ver];
  const nh = ver === "A" ? 0 : ver === "B" ? 1 : 2;
  const stepNames = ["第一步", "第二步"];
  const letters = ["(A)", "(B)", "(C)", "(D)"];
  const hasWrong = groups.some(g => g.items.some(it => it.wrongN !== undefined));
  let html = "", keyRows = [];
  groups.forEach(g => {
    const body = g.items.map((it, n) => {
      const q = it.q;
      const ordered = withOpts ? seededShuffle(q.options, q.q) : null; // 選項順序以題目為種子，每次列印都一樣
      keyRows.push({ unit: it.unit, n: n + 1, ans: ordered ? `${letters[ordered.indexOf(q.correctStr)]} ${q.correctStr}` : q.correctStr, how: q.hints[2], wrongN: it.wrongN });
      return `<div class="pq ${q.fig ? "pq-g" : ""}"><div class="pq-main">
        <div class="pq-head"><span class="pq-no">${n + 1}.</span><div>${it.unitTag ? `<span class="pq-adv" style="margin:0 6px 0 0">${it.unitTag}</span>` : ""}${q.q}${q.lv === 2 ? `<span class="pq-adv">★進階</span>` : ""}</div></div>
        ${ordered ? `<div class="pq-opts">${ordered.map((o, k) => `<span>${letters[k]} ${o}</span>`).join("")}</div>` : ""}
        ${q.hints.slice(0, nh).map((h, k) => `<div class="pq-hint"><b>${stepNames[k]}</b>${h}</div>`).join("")}
        <div class="pq-work" style="height:${q.fig && vi.work < 30 ? 30 : vi.work}mm">${ver === "C" ? `<span style="font-size:10pt;color:#555">最後一步：</span>` : ""}<div class="ans">答：<span>&nbsp;</span></div></div>
      </div>${q.fig ? `<div class="pq-fig">${figSVG(q.fig, true)}</div>` : ""}</div>`;
    }).join("");
    html += `<section class="sheet">
      <div class="sheet-head">
        <div><div class="sheet-title">${g.title}<span class="ver-tag">${vi.name}</span></div>
        <div class="sheet-sub">${g.subtitle}</div></div>
        <div class="sheet-fields">班級 <span></span> 座號 <span style="min-width:10mm"></span> 姓名 <span style="min-width:26mm"></span></div>
      </div>
      <div class="sheet-guide">📝 ${vi.guide}${withOpts ? "（請把選項代號寫在「答：」後面）" : ""}</div>
      ${body}
    </section>`;
  });
  if (withKey) {
    html += `<section class="sheet"><div class="sheet-head"><div><div class="sheet-title">解答（教師用）<span class="ver-tag">${vi.name}</span></div><div class="sheet-sub">關鍵步驟即網站上的第 3 個提示${hasWrong ? "；「答錯人數」為曾答錯（或用完提示）的學生數" : ""}</div></div></div>
      <table class="key-table"><thead><tr><th style="width:16%">單元</th><th style="width:6%">題</th>${hasWrong ? `<th style="width:9%">答錯人數</th>` : ""}<th style="width:28%">答案</th><th>關鍵步驟</th></tr></thead><tbody>
      ${keyRows.map(r => `<tr><td>${r.unit}</td><td>${r.n}</td>${hasWrong ? `<td>${r.wrongN ?? ""} 人</td>` : ""}<td>${r.ans}</td><td>${r.how}</td></tr>`).join("")}</tbody></table></section>`;
  }
  const root = document.getElementById("print-root");
  root.innerHTML = html;
  document.getElementById("print-summary").textContent = `學習單預覽｜${vi.name}｜${summary}`;
  document.getElementById("print-overlay").classList.remove("hidden");
  document.getElementById("print-overlay").scrollTop = 0;
  document.body.style.overflow = "hidden";
  triggerKatex(root);
}

function seededShuffle(arr, seedStr) {
  let h = 2166136261; for (const c of seedStr) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); }
  const rnd = () => { h = Math.imul(h ^ (h >>> 15), 2246822507); h = Math.imul(h ^ (h >>> 13), 3266489909); h ^= h >>> 16; return (h >>> 0) / 4294967296; };
  const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a;
}

// ================== 數學馬戲團：圖像元件（全部 SVG，原創設計） ==================
function rng(seed) { let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const shade = (hex, f) => { const n = parseInt(hex.slice(1), 16); let r = n >> 16, g = n >> 8 & 255, b = n & 255; const m = v => Math.max(0, Math.min(255, Math.round(f < 0 ? v * (1 + f) : v + (255 - v) * f))); return `#${((1 << 24) + (m(r) << 16) + (m(g) << 8) + m(b)).toString(16).slice(1)}`; };
const P = pts => pts.map(p => p.map(v => Math.round(v * 10) / 10).join(",")).join(" ");
function blob(cx, cy, rx, ry, r, n = 16, j = 0.18) { return [...Array(n)].map((_, k) => { const a = k * 2 * Math.PI / n, f = 1 - j / 2 + r() * j; return [cx + Math.cos(a) * rx * f, cy + Math.sin(a) * ry * f]; }); }

function svgDefs() {

    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity=".25"/></filter></defs>`;
}
function svgWaves(W, H, seed, n) { const r = rng(seed); let s = ""; for (let k = 0; k < n; k++) { const x = r() * W, y = r() * H, w = 14 + r() * 16; s += `<path d="M${x} ${y} q${w / 2} -6 ${w} 0" stroke="#fff" stroke-opacity=".35" stroke-width="2.2" fill="none" stroke-linecap="round"/>`; } return s; }

// ---------- 自然 ----------
function svgTree(x, y, s, r) {
  const g1 = ["#4caf50", "#43a047", "#66bb6a", "#388e3c"][Math.floor(r() * 4)], g2 = shade(g1, -0.22);
  if (r() < 0.35) return `<g><rect x="${x - 2.5 * s}" y="${y - 8 * s}" width="${5 * s}" height="${10 * s}" fill="#8d6e63"/>
      <polygon points="${P([[x, y - 46 * s], [x - 16 * s, y - 8 * s], [x, y - 4 * s]])}" fill="${shade(g1, -0.05)}"/><polygon points="${P([[x, y - 46 * s], [x + 16 * s, y - 8 * s], [x, y - 4 * s]])}" fill="${g2}"/>
      <polygon points="${P([[x, y - 58 * s], [x - 11 * s, y - 30 * s], [x, y - 27 * s]])}" fill="${shade(g1, 0.08)}"/><polygon points="${P([[x, y - 58 * s], [x + 11 * s, y - 30 * s], [x, y - 27 * s]])}" fill="${shade(g2, 0.05)}"/></g>`;
  const c = y - 26 * s, R0 = 17 * s, pts = [...Array(7)].map((_, k) => { const a = -Math.PI / 2 + k * 2 * Math.PI / 7; const rr = R0 * (0.85 + r() * 0.3); return [x + Math.cos(a) * rr, c + Math.sin(a) * rr]; });
  return `<g><rect x="${x - 2.5 * s}" y="${y - 12 * s}" width="${5 * s}" height="${13 * s}" fill="#8d6e63"/><polygon points="${P(pts)}" fill="${g1}"/><polygon points="${P([[x, c - R0], ...pts.filter(p => p[0] > x), [x, c + R0 * 0.9]])}" fill="${g2}"/></g>`;
}
function svgPalm(x, y, s) {
  let g = `<path d="M${x} ${y} q${4 * s} ${-25 * s} ${-2 * s} ${-50 * s}" stroke="#a1795a" stroke-width="${6 * s}" fill="none" stroke-linecap="round"/>`;
  [[-28, -6], [26, -4], [-18, 10], [18, 12], [0, -16]].forEach(([dx, dy]) => { g += `<path d="M${x - 2 * s} ${y - 50 * s} q${dx * 0.5 * s} ${(dy - 14) * s} ${dx * s} ${(dy + 6) * s}" stroke="#2e7d32" stroke-width="${5 * s}" fill="none" stroke-linecap="round"/>`; });
  return g + `<circle cx="${x - 4 * s}" cy="${y - 46 * s}" r="${3 * s}" fill="#795548"/><circle cx="${x + 2 * s}" cy="${y - 45 * s}" r="${3 * s}" fill="#795548"/>`;
}
function svgBalloons(x, y, s, r) {
  let g = "";
  [[-10, -78, "#ef4444"], [6, -88, "#3b82f6"], [18, -74, "#facc15"], [-2, -66, "#22c55e"]].forEach(([dx, dy, c]) => {
    g += `<path d="M${x} ${y} Q${x + dx * s * 0.5} ${y + dy * s * 0.5} ${x + dx * s} ${y + (dy + 12) * s}" stroke="#78716c" stroke-width="1" fill="none"/><ellipse cx="${x + dx * s}" cy="${y + dy * s}" rx="${9 * s}" ry="${11 * s}" fill="${c}"/><ellipse cx="${x + (dx - 3) * s}" cy="${y + (dy - 4) * s}" rx="${2.5 * s}" ry="${3.5 * s}" fill="#fff" opacity=".6"/>`;
  });

// 彩旗串
function svgBunting(x1, y1, x2, y2, sag, n, r) {
  const cols = ["#ef4444", "#facc15", "#3b82f6", "#22c55e", "#a855f7"];
  let g = `<path d="M${x1} ${y1} Q${(x1 + x2) / 2} ${(y1 + y2) / 2 + sag} ${x2} ${y2}" stroke="#57534e" stroke-width="1.5" fill="none"/>`;
  for (let k = 1; k < n; k++) { const t = k / n, x = (1 - t) ** 2 * x1 + 2 * (1 - t) * t * (x1 + x2) / 2 + t * t * x2, y = (1 - t) ** 2 * y1 + 2 * (1 - t) * t * ((y1 + y2) / 2 + sag) + t * t * y2; g += `<polygon points="${P([[x - 6, y], [x + 6, y], [x, y + 13]])}" fill="${cols[k % 5]}"/>`; }
  return g;
}

// ---------- 馬戲團建築 ----------
function svgTent(cx, cy, w, h, hr, c1, c2 = "#ffffff", n = 8, flag = "#facc15") {
  const e = 0.34, X = t => cx + w * Math.cos(t), Yb = t => cy + w * e * Math.sin(t);
  let s = `<ellipse cx="${cx + w * 0.12}" cy="${cy + w * e + 4}" rx="${w * 1.2}" ry="${w * e * 1.05}" fill="rgba(0,0,0,.14)"/>`;
  for (let k = 0; k < n; k++) { const a0 = Math.PI - k * Math.PI / n, a1 = Math.PI - (k + 1) * Math.PI / n; s += `<polygon points="${P([[X(a0), Yb(a0) - h], [X(a1), Yb(a1) - h], [X(a1), Yb(a1)], [X(a0), Yb(a0)]])}" fill="${k % 2 ? c2 : c1}"/>`; }
  s += `<path d="M${cx - w * 0.2} ${Yb(Math.PI / 2)} L${cx - w * 0.2} ${Yb(Math.PI / 2) - h * 0.62} Q${cx} ${Yb(Math.PI / 2) - h * 0.9} ${cx + w * 0.2} ${Yb(Math.PI / 2) - h * 0.62} L${cx + w * 0.2} ${Yb(Math.PI / 2)} Z" fill="#3b0764"/>`;

// ================== 增強機制：闖關道具、小寵物（數學魔獸）、機器人造型 ==================
function playerStats(hist = studentHistory, sc = scores) {
  const id = h => String(h.moduleId);
  const isB = (i) => sc[i] && sc[i].best / MODS[i].practice.length >= 0.65;
  const bookB = b => bookUnits(b).filter(isB).length;
  return {
    correct: hist.reduce((a, h) => a + (h.score || 0), 0),
    rounds: hist.filter(h => !/^review/.test(id(h))).length,
    reviews: hist.filter(h => /^review/.test(id(h))).length,
    fixed: hist.filter(h => /^review/.test(id(h))).reduce((a, h) => a + (h.score || 0), 0),
    gens: hist.filter(h => /^gen/.test(id(h))).length,
    mocks: hist.filter(h => id(h) === "mock").length,
    mockB: sc.mock && sc.mock.best / MOCK_N >= 0.65 ? 1 : 0,
    unitB: MODS.filter((m, i) => isB(i)).length,
    perfect: MODS.filter((m, i) => sc[i] && sc[i].best === m.practice.length).length,
    books: [1, 2, 3, 4, 5, 6].filter(b => bookB(b) > 0).length,
    bookB,
    days: new Set(hist.map(h => new Date(h.timestamp).toDateString())).size
  };
}

  </div>`;
}
function unitListHTML(b, u, recI) {
  const B = BOOKS[b], maxF = Math.max(...MODS.map(m => m.freq));
  return `<div class="space-y-3">${u.map((i, k) => {
    const m = MODS[i], sc = scores[i], rr = unitRatio(i), stars = cpStars(i, b), x = scores["x" + i], top3 = k < 3 && m.freq > 0, isRec = i === recI;
    return `<div class="bg-white rounded-[22px] border-2 ${isRec ? "border-rose-300 ring-4 ring-rose-100" : "border-stone-100"} p-4 flex gap-3">
      <div class="flex-shrink-0 w-12 text-center">${top3 ? `<div class="w-11 h-11 mx-auto rounded-full flex items-center justify-center text-lg font-black border-4" style="background:${MEDAL[k][1]};border-color:${MEDAL[k][0]};color:${MEDAL[k][0]}">${k + 1}</div><div class="text-[9px] font-black mt-1" style="color:${MEDAL[k][0]}">常考 Top${k + 1}</div>` : `<div class="text-2xl font-black text-stone-300 pt-2">${k + 1}</div>`}</div>
      <div class="min-w-0 flex-1">
        <div class="flex flex-wrap items-center gap-1.5"><span class="font-black text-stone-800">${m.title}</span>${lvBadge(rr)}${isRec ? `<span class="text-[10px] font-black text-white bg-rose-500 rounded-full px-2 py-0.5">📍 CP 值最高</span>` : ""}</div>
        <div class="flex flex-wrap items-center gap-x-3 gap-y-1 mt-1.5"><span class="flex items-center gap-1.5"><span class="h-2 w-16 bg-stone-100 rounded-full overflow-hidden inline-block"><span class="block h-full rounded-full" style="width:${m.freq / maxF * 100}%;background:${B.hex}"></span></span><span class="text-[11px] text-stone-500">${m.freq ? `出現 ${m.freq} 題` : "加分單元"}</span></span><span class="text-[11px] text-stone-500">CP <span class="text-amber-500">${"★".repeat(stars)}<span class="text-stone-200">${"★".repeat(5 - stars)}</span></span></span></div>
        <div class="text-[11px] text-stone-400 mt-1 tabular-nums">題庫 ${m.practice.length} 題・${sc ? `首次 ${sc.first}／最佳 ${sc.best}` : "尚未挑戰"}${x ? `・🎲 加練 ${x.rounds} 回` : ""}</div>
        <div class="flex gap-2 mt-2"><button onclick="switchView(${i})" class="px-4 py-2 rounded-xl text-white text-sm font-black" style="background:${B.hex}">${sc ? "再挑戰" : "開始"}</button><button onclick="switchView('gen${i}')" class="px-3 py-2 rounded-xl bg-amber-100 text-amber-900 text-sm font-black">🎲 加練</button><button onclick="openPrintSetup(${i})" class="px-3 py-2 rounded-xl bg-stone-100 text-stone-700 text-sm font-bold">🖨️</button></div>
      </div></div>`;
  }).join("")}</div>`;
}
function openDrawer() { const d = document.getElementById("drawer"); if (d) d.classList.remove("hidden"); }
function closeDrawer() { const d = document.getElementById("drawer"); if (d) d.classList.add("hidden"); }

// ---------- 單元卡片 ----------
function openUnitSheet(i) {
  const m = MODS[i], B = BOOKS[m.book], sc = scores[i], rr = unitRatio(i), x = scores["x" + i], k = bookUnits(m.book).indexOf(i), top3 = k < 3 && m.freq > 0, isRec = i === islandRecommend(m.book);
  const el = document.getElementById("unit-sheet");
  el.querySelector(".us-body").innerHTML = `
    <div class="flex items-start justify-between gap-3">
      <div class="min-w-0"><div class="text-xs font-black" style="color:${B.hex}">${B.name}島・${m.chap}</div>
        <div class="text-2xl font-black text-stone-800 mt-1">${m.title} ${lvBadge(rr)}</div>
        <div class="flex flex-wrap gap-2 mt-2">${top3 ? `<span class="text-xs font-black rounded-full px-2.5 py-1" style="background:${MEDAL[k][1]};color:${MEDAL[k][0]}">🎪 ${MEDAL[k][2]}</span>` : ""}${isRec ? `<span class="text-xs font-black text-white bg-rose-500 rounded-full px-2.5 py-1">📍 CP 值最高・先練</span>` : ""}</div></div>
      <button onclick="closeUnitSheet()" class="w-10 h-10 rounded-xl bg-stone-100 text-stone-600 font-black flex-shrink-0" aria-label="關閉">✕</button>
    </div>
    <p class="text-sm text-stone-500 mt-3">${m.subtitle}</p>
    <div class="grid grid-cols-3 gap-2 mt-4 text-center">
      <div class="rounded-2xl bg-stone-50 p-3"><div class="text-[11px] font-bold text-stone-400">會考出現</div><div class="text-xl font-black text-stone-800">${m.freq}<span class="text-xs"> 題</span></div></div>
      <div class="rounded-2xl bg-stone-50 p-3"><div class="text-[11px] font-bold text-stone-400">最佳紀錄</div><div class="text-xl font-black text-stone-800">${sc ? `${sc.best}/${m.practice.length}` : "—"}</div></div>
      <div class="rounded-2xl bg-stone-50 p-3"><div class="text-[11px] font-bold text-stone-400">CP 值</div><div class="text-lg font-black text-amber-500">${"★".repeat(cpStars(i, m.book))}<span class="text-stone-200">${"★".repeat(5 - cpStars(i, m.book))}</span></div></div>
    </div>
    ${x ? `<div class="text-xs text-stone-500 mt-3">🎲 隨機加練已做 ${x.rounds} 回，共答對 ${x.correct}/${x.total} 題。</div>` : ""}
    <div class="grid gap-2 mt-5">
      <button onclick="closeUnitSheet();switchView(${i})" class="py-4 rounded-2xl text-white font-black text-lg" style="background:${B.hex}">🎪 開始表演（題庫 ${m.practice.length} 題）</button>
      <button onclick="closeUnitSheet();switchView('gen${i}')" class="py-3.5 rounded-2xl bg-amber-100 text-amber-900 font-black">🎲 隨機加練 10 題（數字每次都不同）</button>
      <button onclick="closeUnitSheet();openPrintSetup(${i})" class="py-3 rounded-2xl bg-stone-100 text-stone-700 font-bold">🖨️ 列印這個單元的學習單</button>
    </div>`;
  el.classList.remove("hidden");
}
function closeUnitSheet() { const el = document.getElementById("unit-sheet"); if (el) el.classList.add("hidden"); }

// ---------- 錯題重練：消滅健忘怪物 ----------
function renderReviewHub() {
  isQuizActive = false;
  const t = nowTs(), b = stageBuckets(mistakes, t), killed = Object.keys(slain).length;
  const card = s => {
    const I = STAGE_INFO[s], r = b[s].ready.length, l = b[s].locked.length;
    const c = { rose: ["bg-rose-50", "border-rose-200", "text-rose-700", "bg-rose-500"], amber: ["bg-amber-50", "border-amber-200", "text-amber-700", "bg-amber-500"], violet: ["bg-violet-50", "border-violet-200", "text-violet-700", "bg-violet-500"] }[I.color];
    return `<section class="rounded-[28px] border-2 ${c[1]} ${c[0]} p-5 flex flex-col">
      <div class="flex items-center gap-3"><span class="text-4xl">${I.icon}</span><div><div class="font-black ${c[2]} text-lg">${I.name}</div>
        <div class="text-xs text-stone-500">${s === 1 ? "答錯的題目先來這裡，答對就移到第二關" : s === 2 ? "從第一關答對後，等 2 天才解鎖" : "第二關答對後，等 5 天才解鎖；答對就消滅怪物"}</div></div></div>
      <div class="flex gap-3 mt-4 text-center">
        <div class="flex-1 bg-white rounded-2xl py-3"><div class="text-[11px] font-bold text-stone-400">可以挑戰</div><div class="text-3xl font-black ${c[2]} tabular-nums">${r}</div></div>
        <div class="flex-1 bg-white rounded-2xl py-3"><div class="text-[11px] font-bold text-stone-400">還沒解鎖</div><div class="text-3xl font-black text-stone-400 tabular-nums">${l}</div></div>
      </div>
      ${l ? `<div class="mt-3 text-xs text-stone-500 space-y-1 max-h-28 overflow-y-auto">${b[s].locked.slice(0, 6).map(m => `<div class="flex justify-between gap-2"><span class="truncate">🔒 ${escapeHtml(MODS[m.modIdx] ? `${BOOKS[MODS[m.modIdx].book].short}冊 ${MODS[m.modIdx].title}` : "")}</span><span class="whitespace-nowrap tabular-nums">${fmtTime(m.due)}（${fmtLeft(m.due - t)}）</span></div>`).join("")}${l > 6 ? `<div>……還有 ${l - 6} 題</div>` : ""}</div>` : ""}
      <button ${r ? `onclick="switchView('review${s}')"` : "disabled"} class="mt-4 py-3 rounded-2xl font-black text-white ${r ? c[3] + " hover:opacity-90" : "bg-stone-300 cursor-not-allowed"}">${r ? `開始${I.short}（${r} 題）` : l ? `等待解鎖中` : "目前沒有題目"}</button>
    </section>`;
  };
  document.getElementById("main-content").innerHTML = `
  <div class="fade-in space-y-6">
    <div class="flex flex-col md:flex-row md:items-end md:justify-between gap-4">
      <div><h1 class="text-3xl sm:text-4xl font-black text-stone-800">👾 錯題重練：消滅健忘怪物</h1>
        <p class="text-stone-500 mt-2 leading-relaxed">每一題錯題都是一隻健忘怪物。要在<b>當下、兩天後、五天後</b>都獨立答對（沒看完 3 步提示），才能真正消滅牠！<br><span class="text-sm">任何一關答錯或看完提示，怪物會逃回第一關。</span></p></div>
      <div class="bg-emerald-500 text-white rounded-[24px] px-6 py-4 text-center flex-shrink-0"><div class="text-xs font-black opacity-90">已消滅健忘怪物</div><div class="text-4xl font-black tabular-nums">🏆 ${killed}</div></div>
    </div>
    <div class="grid md:grid-cols-3 gap-4">${card(1)}${card(2)}${card(3)}</div>
    ${!mistakes.length ? `<div class="text-center py-6 text-stone-500 font-bold">🎉 目前沒有錯題！繼續挑戰各單元吧。</div>` : ""}
    <div class="text-center"><button onclick="switchView('map')" class="px-6 py-3 rounded-2xl bg-stone-100 font-bold text-stone-700">回群島</button> <button onclick="switchView('overview')" class="px-6 py-3 rounded-2xl bg-stone-100 font-bold text-stone-700">學習報告</button></div>
  </div>`;
}

function monsterPanel() {
  const t = nowTs(), b = stageBuckets(mistakes, t), killed = Object.keys(slain).length;
  if (!mistakes.length && !killed) return "";
  const nextLock = [1, 2, 3].flatMap(s => b[s].locked).sort((x, y) => x.due - y.due)[0];
  const cell = s => `<div class="bg-white rounded-2xl px-3 py-3 text-center"><div class="text-2xl">${STAGE_INFO[s].icon}</div><div class="text-xs font-black text-stone-500 mt-1">${STAGE_INFO[s].short}</div><div class="text-xl font-black text-stone-800 tabular-nums">${b[s].ready.length + b[s].locked.length}</div><div class="text-[11px] ${b[s].ready.length ? "text-rose-600 font-bold" : "text-stone-400"}">${b[s].ready.length ? `可挑戰 ${b[s].ready.length}` : b[s].locked.length ? "鎖定中" : "—"}</div></div>`;
  return `<section class="rounded-[36px] bg-rose-50 border border-rose-100 p-6 sm:p-8">
    <div class="flex flex-wrap items-center justify-between gap-3 mb-4"><h2 class="text-2xl font-black text-rose-900 flex items-center gap-3"><span>👾</span>消滅健忘怪物</h2>
      <div class="text-sm font-bold text-emerald-700 bg-white rounded-2xl px-4 py-2">🏆 已消滅 ${killed} 隻</div></div>
    <p class="text-sm text-rose-900/80 mb-4">錯題要在當下、2 天後、5 天後都獨立答對，才算真正記住。${nextLock ? `下一隻怪物 ${fmtTime(nextLock.due)} 解鎖（${fmtLeft(nextLock.due - t)}）。` : ""}</p>
    <div class="grid grid-cols-3 gap-3 max-w-xl">${cell(1)}${cell(2)}${cell(3)}</div>
    <button onclick="switchView('review')" class="mt-5 px-5 py-3 rounded-2xl bg-rose-500 hover:bg-rose-600 text-white font-bold">前往錯題重練區 →</button>
  </section>`;
}

// ---------- 啟動（放在最後，確保所有程式都已載入） ----------
let lastTallMap = isTall();
window.addEventListener("resize", () => { const t = isTall(); if (t !== lastTallMap) { lastTallMap = t; if (currentView === "map") renderWorldMap(); else if (/^book\d$/.test(String(currentView))) renderBook(viewBook(currentView)); } });
(function boot() {
  const cur = lsGet(LS_PREFIX + "current_student", null);
  if (cur && cur.seat && cur.name) { studentSeat = normSeat(cur.seat) || cur.seat; studentName = normName(cur.name); migrateLocal(cur.seat, cur.name); lsSet(LS_PREFIX + "current_student", { seat: studentSeat, name: studentName }); loadLocal(); currentView = "map"; renderWorldMap(); renderNav(); rw(); }
  else renderNameEntry();
  initFirebase();
})();

</script>
</body>
</html>
